<script>
"use strict";

/*
 BTC Paper Engine
 データ元: docs/data.json / data.json / state.json
 実注文なし。公開データとペーパートレード記録のみ使用。
*/

const CONFIG = {
  refreshMs: 60000,
  // 円換算の概算レート。必要なら変更してください。
  usdJpy: 150,
  maxTrades: 5
};

const $ = id => document.getElementById(id);

function first(obj, paths, fallback = null) {
  for (const path of paths) {
    let value = obj;
    for (const key of path.split(".")) {
      if (value == null) break;
      value = value[key];
    }
    if (value !== undefined && value !== null && value !== "") {
      return value;
    }
  }
  return fallback;
}

function number(value, fallback = null) {
  if (value === null || value === undefined || value === "") return fallback;
  const n = Number(value);
  return Number.isFinite(n) ? n : fallback;
}

function money(value, digits = 2) {
  const n = number(value);
  if (n === null) return "--";
  return n.toLocaleString("en-US", {
    minimumFractionDigits: digits,
    maximumFractionDigits: digits
  });
}

function yen(value) {
  const n = number(value);
  if (n === null) return "";
  return "約¥" + Math.round(n * CONFIG.usdJpy).toLocaleString("ja-JP");
}

function setText(id, value) {
  $(id).textContent = value == null ? "--" : String(value);
}

function signedMoney(value) {
  const n = number(value);
  if (n === null) return "--";
  return (n > 0 ? "+" : "") + money(n);
}

function setProfitStyle(id, value) {
  const n = number(value);
  $(id).classList.remove("good", "bad");
  if (n !== null) $(id).classList.add(n >= 0 ? "good" : "bad");
}

function directionLabel(value) {
  const s = String(value ?? "WAIT").toUpperCase();
  if (s.includes("LONG") || s.includes("BUY")) return "LONG";
  if (s.includes("SHORT") || s.includes("SELL")) return "SHORT";
  return "WAIT";
}

function getTrades(data) {
  const t = first(data, [
    "paper_trades",
    "trades",
    "closed_trades",
    "state.paper_trades",
    "state.trades"
  ], []);
  return Array.isArray(t) ? t : [];
}

function getEquityHistory(data) {
  const h = first(data, [
    "equity_history",
    "equity_curve",
    "balance_history",
    "history",
    "snapshots",
    "state.equity_history"
  ], []);

  if (!Array.isArray(h)) return [];

  return h.map(item => {
    if (typeof item === "number") return item;
    return number(first(item, [
      "equity", "balance", "value", "account_value", "total_equity"
    ]));
  }).filter(v => v !== null && v > 0).slice(-100);
}

function deriveStats(data, trades) {
  const closed = trades.filter(t => {
    const status = String(first(t, ["status", "state"], "")).toLowerCase();
    return !status || status.includes("closed") ||
      status.includes("close") || t.exit_price != null ||
      t.exit_time != null || t.closed_at != null;
  });

  const pnlValues = closed.map(t => number(first(t, [
    "net_pnl", "pnl", "profit", "realized_pnl",
    "realised_pnl", "net_profit"
  ]))).filter(v => v !== null);

  const wins = pnlValues.filter(v => v > 0).length;
  const computedWinrate = pnlValues.length
    ? wins / pnlValues.length * 100 : null;

  const computedRealized = pnlValues.length
    ? pnlValues.reduce((a, b) => a + b, 0) : null;

  return {
    count: closed.length,
    winrate: number(first(data, [
      "win_rate", "winrate", "stats.win_rate", "stats.winrate"
    ]), computedWinrate),
    realized: number(first(data, [
      "realized_pnl", "realized_profit",
      "stats.realized_pnl", "stats.total_realized_pnl"
    ]), computedRealized)
  };
}

function drawChart(history) {
  const canvas = $("chart");
  const rect = canvas.getBoundingClientRect();
  if (!rect.width || !rect.height) return;

  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = Math.round(rect.width * dpr);
  canvas.height = Math.round(rect.height * dpr);

  const ctx = canvas.getContext("2d");
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, rect.width, rect.height);

  const values = history.slice(-100);
  if (values.length < 2) return;

  const min = Math.min(...values);
  const max = Math.max(...values);
  const spread = max - min || Math.max(Math.abs(max) * 0.001, 1);
  const pad = 5;
  const w = rect.width - pad * 2;
  const h = rect.height - pad * 2;

  const points = values.map((v, i) => ({
    x: pad + i / (values.length - 1) * w,
    y: pad + (max - v) / spread * h
  }));

  // 線と面を描画
  ctx.beginPath();
  points.forEach((p, i) => {
    if (i === 0) ctx.moveTo(p.x, p.y);
    else ctx.lineTo(p.x, p.y);
  });

  const gradient = ctx.createLinearGradient(0, 0, 0, rect.height);
  gradient.addColorStop(0, "rgba(255,65,176,.50)");
  gradient.addColorStop(1, "rgba(184,118,255,.04)");

  ctx.lineTo(points[points.length - 1].x, rect.height);
  ctx.lineTo(points[0].x, rect.height);
  ctx.closePath();
  ctx.fillStyle = gradient;
  ctx.fill();

  ctx.beginPath();
  points.forEach((p, i) => {
    if (i === 0) ctx.moveTo(p.x, p.y);
    else ctx.lineTo(p.x, p.y);
  });
  ctx.strokeStyle = "#e843b0";
  ctx.lineWidth = 2;
  ctx.lineJoin = "round";
  ctx.stroke();

  const last = points[points.length - 1];
  ctx.beginPath();
  ctx.arc(last.x, last.y, 3, 0, Math.PI * 2);
  ctx.fillStyle = "#7e42d9";
  ctx.fill();
}

function renderTrades(trades) {
  const container = $("tradeRows");
  container.replaceChildren();

  const list = trades.slice(-CONFIG.maxTrades).reverse();

  for (const trade of list) {
    const row = document.createElement("div");
    row.className = "trade-row";

    const time = first(trade, [
      "exit_time", "closed_at", "timestamp", "time",
      "entry_time", "opened_at"
    ], "--");

    const date = String(time).replace("T", " ").slice(0, 16);
    const side = directionLabel(first(trade, [
      "direction", "side", "position", "type"
    ], "--"));

    const pnl = number(first(trade, [
      "net_pnl", "pnl", "profit", "realized_pnl"
    ]));

    const reason = first(trade, [
      "exit_reason", "reason", "close_reason", "strategy"
    ], "--");

    [date, side, pnl === null ? "--" : signedMoney(pnl), reason]
      .forEach((value, i) => {
        const span = document.createElement("span");
        span.textContent = String(value);
        if (i === 2 && pnl !== null) {
          span.style.color = pnl >= 0 ? "#d62b98" : "#3478d8";
        }
        row.appendChild(span);
      });

    container.appendChild(row);
  }
}

function render(data) {
  const price = number(first(data, [
    "price", "btc_price", "market.price", "ticker.price"
  ]));

  const equity = number(first(data, [
    "equity", "account_value", "total_equity",
    "portfolio_value", "state.equity"
  ]));

  const initial = number(first(data, [
    "initial_equity", "initial_bankroll",
    "starting_equity", "config.initial_equity"
  ]), 100);

  const unrealized = number(first(data, [
    "unrealized_pnl", "unrealized_profit",
    "open_pnl", "floating_pnl", "position.unrealized_pnl"
  ]), 0);

  const signal = first(data, [
    "signal.direction", "signal", "current_signal", "direction"
  ], "WAIT");

  const score = number(first(data, [
    "signal.score", "score", "signal_score"
  ]));

  const rsi = number(first(data, [
    "indicators.rsi_15m", "rsi_15m", "rsi",
    "indicators.rsi"
  ]));

  const reason = first(data, [
    "signal.reason", "reason", "signal.explanation"
  ], "シグナル理由のデータなし");

  const trades = getTrades(data);
  const stats = deriveStats(data, trades);
  const history = getEquityHistory(data);

  // BTC価格
  setText("priceUsd", price === null ? "--" : "$" + money(price, 1));
  setText("priceJpy", price === null ? "" : yen(price));

  // 資産額。実際のdata.jsonに含まれるequityを優先
  setText("equityUsd", equity === null ? "--" : "$" + money(equity));
  setText("equityJpy", equity === null ? "" : yen(equity));

  // 確定損益。元データがなければ、クローズ済み取引から算出
  setText("realizedUsd",
    stats.realized === null ? "--" : signedMoney(stats.realized));
  setProfitStyle("realizedUsd", stats.realized);

  // 勝率
  setText("winrateValue",
    stats.winrate === null ? "--" : stats.winrate.toFixed(1) + "%");

  // 含み損益
  setText("pnlUsd", signedMoney(unrealized));
  setText("pnlJpy", yen(unrealized));
  setProfitStyle("pnlUsd", unrealized);

  // 最大ドローダウン：保存済み値があれば優先
  const maxDD = number(first(data, [
    "max_drawdown_pct", "max_dd_pct", "max_dd",
    "stats.max_drawdown_pct", "risk.max_drawdown_pct"
  ]));

  setText("maxddValue",
    maxDD === null ? "--" :
    (Math.abs(maxDD) > 0 && Math.abs(maxDD) <= 1
      ? (Math.abs(maxDD) * 100).toFixed(2)
      : Math.abs(maxDD).toFixed(2)) + "%");

  // シグナルとインジケーター
  const direction = directionLabel(signal);
  setText("signal", direction);
  setText("score", score === null ? "--" : score);
  setText("rsi", rsi === null ? "--" : rsi.toFixed(1));

  $("signal").classList.remove("good", "bad");
  if (direction === "LONG") $("signal").classList.add("good");
  if (direction === "SHORT") $("signal").classList.add("bad");

  setText("reason", reason);

  // ポジション
  const position = first(data, [
    "position.direction", "position.side", "position",
    "current_position", "open_position"
  ], "NONE");

  setText("position",
    typeof position === "object"
      ? directionLabel(position.direction || position.side || "NONE")
      : String(position).toUpperCase());

  setText("openPnl", signedMoney(unrealized));
  setProfitStyle("openPnl", unrealized);

  // エンジン状態。15m/1h/4hの方向はデータがある場合のみ表示
  const status = String(first(data, [
    "market_status", "engine_status", "status"
  ], "UNKNOWN"));

  setText("botStatus", status);
  setText("status15m", first(data, [
    "timeframes.15m.direction", "trend.15m", "indicators.15m"
  ], "--"));
  setText("status1h", first(data, [
    "timeframes.1h.direction", "trend.1h", "indicators.1h"
  ], "--"));
  setText("status4h", first(data, [
    "timeframes.4h.direction", "trend.4h", "indicators.4h"
  ], "--"));

  // レベル表示は実装済みのXPデータがあるときだけ反映
  const xp = number(first(data, [
    "xp", "experience", "rpg.xp"
  ]));
  const stage = number(first(data, [
    "stage", "level", "rpg.stage"
  ]));

  setText("stageLevel", stage === null ? "Lv. --" : "Lv. " + stage);
  setText("xpValue", xp === null ? "-- / 500 XP" : xp + " / 500 XP");

  // フィボナッチ価格：元データに値があるときだけ表示
  const fib = number(first(data, [
    "fibonacci.current_price", "fibonacci.price",
    "fib.current_price", "fib_price"
  ]));
  setText("fibPrice", fib === null ? "--" : "$" + money(fib, 2));

  // グラフ。履歴がなければ初期資産と現在資産を使う
  let graph = history.slice();
  if (graph.length < 2 && equity !== null) {
    graph = [initial, equity];
  }

  drawChart(graph);
  setText("recordCount", String(graph.length));
  setText("latestEquity",
    equity === null ? "--" : "$" + money(equity));

  renderTrades(trades);

  const generated = first(data, [
    "generated_at", "updated_at", "timestamp"
  ], null);

  let timeText = "更新時刻: --";
  if (generated) {
    const dt = new Date(generated);
    if (!Number.isNaN(dt.getTime())) {
      timeText = "更新: " + dt.toLocaleString("ja-JP", {
        month: "2-digit", day: "2-digit",
        hour: "2-digit", minute: "2-digit"
      });
    }
  }
  $("updated").textContent =
    timeText + " ｜ PAPER ONLY ｜ 自動更新60秒";
}

async function loadData() {
  const candidates = [
    "./docs/data.json",
    "./data.json",
    "./state.json",
    "./docs/state.json"
  ];

  let lastError = null;

  for (const path of candidates) {
    try {
      const response = await fetch(
        path + "?_=" + Date.now(),
        { cache: "no-store" }
      );

      if (!response.ok) {
        lastError = new Error(path + ": HTTP " + response.status);
        continue;
      }

      const data = await response.json();

      if (!data || typeof data !== "object") {
        lastError = new Error("JSON形式が不正です");
        continue;
      }

      render(data);
      $("error").style.display = "none";
      return;
    } catch (error) {
      lastError = error;
    }
  }

  $("updated").textContent = "データ待機中 ｜ PAPER ONLY";
  $("error").style.display = "block";
  $("error").textContent =
    "データを読み込めません。GitHub Pagesの公開状態と、" +
    "docs/data.json の場所・JSON形式を確認してください。" +
    (lastError ? " (" + lastError.message + ")" : "");
}

loadData();
setInterval(loadData, CONFIG.refreshMs);

window.addEventListener("resize", () => {
  loadData();
});
</script>
</body>
</html>
