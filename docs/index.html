<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f9edff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="BTC冒険記">
<link rel="apple-touch-icon" href="./IMG_6282.jpeg">
<title>萌え萌えキュン♡ BTC冒険記</title>

<style>
/* =========================================
   1. 基本設定
========================================= */

*{
 box-sizing:border-box;
}

html,
body{
 margin:0;
 width:100%;
 min-height:100%;
 background:#f9edff;
 color:#40266f;
 font-family:
  -apple-system,
  BlinkMacSystemFont,
  "Hiragino Kaku Gothic ProN",
  "Noto Sans JP",
  sans-serif;
}

html{
 -webkit-text-size-adjust:100%;
}

body{
 overflow-x:hidden;
}

/* =========================================
   2. 背景画像と全体レイアウト
========================================= */

#app{
 position:relative;
 width:min(100%,864px);
 margin:0 auto;
 aspect-ratio:864/1536;
 container-type:inline-size;

 background-color:#fff0ff;
 background-image:url("./6F57182A-FA99-4BC6-A546-EAF0793E5B02.png");
 background-repeat:no-repeat;
 background-position:center top;
 background-size:100% 100%;

 overflow:hidden;
 isolation:isolate;
}

/* =========================================
   3. 数値表示共通設定
========================================= */

.v{
 position:absolute;
 z-index:4;

 display:flex;
 align-items:center;
 justify-content:center;

 min-width:0;
 min-height:0;

 text-align:center;
 overflow:hidden;

 font-variant-numeric:tabular-nums;
 line-height:1.12;
}

.stack{
 flex-direction:column;
}

.num{
 display:block;

 flex:0 1 auto;
 min-width:0;
 max-width:100%;

 font-size:clamp(10px,2.3cqw,18px);
 font-weight:900;
 white-space:nowrap;
 letter-spacing:-.03em;
 line-height:1.1;

 font-variant-numeric:tabular-nums;
 color:#3a1f66;
}

.sub{
 display:block;

 max-width:100%;
 min-width:0;

 font-size:clamp(8px,1.45cqw,12px);
 font-weight:750;
 white-space:nowrap;
 line-height:1.15;

 margin-top:.25cqw;
 color:#5a3a8a;
}

.good{
 color:#c2187a;
}

.bad{
 color:#1f5bb8;
}

/* =========================================
   4. HP・経験値バー
========================================= */

.bar{
 position:absolute;
 z-index:5;

 overflow:hidden;
 border-radius:30px;

 pointer-events:none;
}

.bar .fill{
 height:100%;
 width:0;

 border-radius:inherit;

 transition:width .35s ease;

 background:
  linear-gradient(
   90deg,
   #fa9cde,
   #e34bb8,
   #b26ae9
  );
}

.bar .shine{
 position:absolute;
 inset:0;

 border-radius:inherit;
 border:1px solid rgba(255,255,255,.8);
}

#hpBar{
 left:32.5%;
 top:23.45%;
 width:21.8%;
 height:1.08%;
}

#xpBar{
 left:57.3%;
 top:23.45%;
 width:38.6%;
 height:1.08%;
}

#hpBar .fill{
 background:
  linear-gradient(
   90deg,
   #ffb5e5,
   #ec4cb6
  );
}

#xpBar .fill{
 background:
  linear-gradient(
   90deg,
   #a8a0ff,
   #5579ee
  );
}

/* =========================================
   5. BTC価格・資産・確定損益
========================================= */

#price{
 left:23.5%;
 top:28.65%;
 width:14.2%;
 height:4.15%;
}

#assets{
 left:39.2%;
 top:28.65%;
 width:14.4%;
 height:4.15%;
}

#realized{
 left:54%;
 top:28.65%;
 width:12.2%;
 height:4.15%;
}

/*
 * BTC価格は他の数字より狭い枠に入るため、
 * 初期サイズを小さめにする。
 * JavaScript側でも実測して縮小する。
 */

#priceUsd{
 font-size:clamp(9px,1.9cqw,15px);
 letter-spacing:-.04em;
}

#priceJpy{
 font-size:clamp(7px,1.25cqw,11px);
 letter-spacing:-.03em;
}

#equityUsd{
 font-size:clamp(10px,2.1cqw,16px);
 letter-spacing:-.035em;
}

#equityJpy{
 font-size:clamp(7px,1.25cqw,11px);
}

#realizedUsd{
 font-size:clamp(10px,2.0cqw,16px);
 letter-spacing:-.035em;
}

/* =========================================
   6. 勝率・含み損益・DD
========================================= */

#winrate{
 left:23.5%;
 top:35.9%;
 width:14.2%;
 height:3.1%;
}

#pnl{
 left:39.2%;
 top:35.9%;
 width:14.4%;
 height:3.1%;
}

#maxdd{
 left:54%;
 top:35.9%;
 width:12.2%;
 height:3.1%;
}

#winrateValue{
 font-size:clamp(11px,2.2cqw,17px);
}

#pnlUsd{
 font-size:clamp(10px,2.0cqw,15px);
}

#pnlJpy{
 font-size:clamp(7px,1.2cqw,11px);
}

#maxddValue{
 font-size:clamp(11px,2.1cqw,16px);
}

/* =========================================
   7. 資産推移グラフ
========================================= */

#equityChart{
 position:absolute;
 z-index:4;

 left:23.7%;
 top:44.55%;

 width:41.2%;
 height:12.1%;

 display:block;
}

/* =========================================
   8. グラフ下の表示
========================================= */

#recordCount{
 left:37.4%;
 top:57.85%;
 width:8.8%;
 height:1.55%;

 font-size:clamp(9px,1.7cqw,13px);
 font-weight:900;
 color:#3a1f66;
}

#latestEquity{
 left:50.7%;
 top:57.85%;
 width:14.1%;
 height:1.55%;

 font-size:clamp(9px,1.7cqw,13px);
 font-weight:900;
 color:#3a1f66;
}

/* =========================================
   9. シグナル・スコア・RSI
========================================= */

#signal{
 left:67.6%;
 top:45%;
 width:10.1%;
 height:4.15%;
}

#score{
 left:78%;
 top:45%;
 width:9.3%;
 height:4.15%;
}

#rsi{
 left:87.7%;
 top:45%;
 width:8.7%;
 height:4.15%;
}

#signalValue{
 font-size:clamp(11px,2.1cqw,16px);
}

#scoreValue{
 font-size:clamp(11px,2.1cqw,16px);
}

#rsiValue{
 font-size:clamp(10px,2.0cqw,15px);
}

/* =========================================
   10. シグナル理由
========================================= */

#reason{
 left:68%;
 top:49.8%;
 width:27.5%;
 height:2.4%;

 font-size:clamp(8px,1.4cqw,12px);
 font-weight:800;
 line-height:1.2;
 color:#3a1f66;

 overflow:hidden;
}

#reasonValue{
 display:block;
 width:100%;
 max-width:100%;

 overflow:hidden;
 white-space:nowrap;
 text-overflow:ellipsis;
}

/* =========================================
   11. フィボナッチ
========================================= */

.fib{
 position:absolute;
 z-index:4;

 left:71.0%;
 width:14.5%;
 height:1.7%;

 display:flex;
 align-items:center;
 justify-content:center;

 font-size:clamp(9px,1.75cqw,14px);
 font-weight:900;
 color:#3a1f66;

 white-space:nowrap;
 overflow:hidden;
}

#fib0{
 top:58.3%;
}

#fib236{
 top:60%;
}

#fib382{
 top:61.7%;
}

#fib50{
 top:63.4%;
}

#fib618{
 top:65.1%;
}

#fib786{
 top:66.8%;
}

#fib100{
 top:68.5%;
}

/* =========================================
   12. ポジション・含み損益
========================================= */

#position{
 left:37%;
 top:67%;
 width:9%;
 height:1.8%;
}

#openPnl{
 left:35.4%;
 top:70%;
 width:11.8%;
 height:1.55%;
}

#positionValue{
 font-size:clamp(9px,1.75cqw,14px);
}

#openPnlValue{
 font-size:clamp(9px,1.75cqw,14px);
}

/* =========================================
   13. エンジン・時間足
========================================= */

.engine{
 position:absolute;
 z-index:4;

 left:56.0%;
 width:9.0%;
 height:1.55%;

 font-size:clamp(9px,1.7cqw,13px);
 font-weight:900;
 color:#3a1f66;

 text-align:center;
 white-space:nowrap;
 overflow:hidden;
}

#botStatus{
 top:63.8%;
}

#status15m{
 top:65.45%;
}

#status1h{
 top:67.05%;
}

#status4h{
 top:68.65%;
}

/* =========================================
   14. 取引履歴
========================================= */

#tradeRows{
 position:absolute;
 z-index:5;

 left:23.7%;
 top:80.1%;

 width:72.7%;
 height:7.6%;

 overflow:hidden;

 font-size:clamp(9px,1.55cqw,13px);
 line-height:1.55;
 font-weight:700;

 color:#3a1f66;
}

.trade{
 display:grid;

 grid-template-columns:1.4fr .65fr .8fr 1.25fr;
 gap:.25cqw;

 min-height:22%;

 border-bottom:1px solid #eadcf5;

 align-items:center;
}

.trade span{
 display:block;

 min-width:0;
 overflow:hidden;

 white-space:nowrap;
 text-overflow:ellipsis;
}

/* =========================================
   15. 更新時刻
========================================= */

#updated{
 position:absolute;
 z-index:5;

 left:23%;
 top:89%;
 width:74%;

 text-align:center;

 font-size:clamp(8px,1.3cqw,12px);
 font-weight:700;

 color:#4a3578;

 white-space:nowrap;
 overflow:hidden;
}

/* =========================================
   16. エラー表示
========================================= */

#error{
 display:none;

 position:fixed;
 z-index:20;

 bottom:8px;
 left:8px;
 right:8px;

 padding:12px;

 background:#fff;

 border:1px solid #d7a2e9;
 border-radius:10px;

 font-size:12px;
 line-height:1.5;

 overflow-wrap:anywhere;

 box-shadow:0 3px 14px rgba(80,30,120,.12);
}

/* =========================================
   17. 小さな画面への対応
========================================= */

@media(max-width:380px){

 #priceUsd{
  font-size:clamp(8px,1.7cqw,13px);
 }

 #equityUsd{
  font-size:clamp(9px,1.85cqw,14px);
 }

 #realizedUsd{
  font-size:clamp(9px,1.8cqw,14px);
 }

 #reason{
  font-size:clamp(7px,1.25cqw,11px);
 }

 #tradeRows{
  font-size:clamp(8px,1.4cqw,12px);
 }

 #updated{
  font-size:clamp(7px,1.15cqw,11px);
 }

 .fib{
  font-size:clamp(8px,1.55cqw,12px);
 }

 .engine{
  font-size:clamp(8px,1.5cqw,12px);
 }
}

@media(min-width:865px){

 #app{
  margin:0 auto;
 }
}

@media(prefers-reduced-motion:reduce){

 .bar .fill{
  transition:none;
 }
}
</style>
</head>

<body>

<main id="app">

 <!-- HPバー -->
 <div id="hpBar" class="bar">
  <div id="hpFill" class="fill"></div>
  <div class="shine"></div>
 </div>

 <!-- 経験値バー -->
 <div id="xpBar" class="bar">
  <div id="xpFill" class="fill"></div>
  <div class="shine"></div>
 </div>

 <!-- BTC価格 -->
 <div id="price" class="v stack">
  <div id="priceUsd" class="num">--</div>
  <div id="priceJpy" class="sub"></div>
 </div>

 <!-- 総資産 -->
 <div id="assets" class="v stack">
  <div id="equityUsd" class="num">--</div>
  <div id="equityJpy" class="sub"></div>
 </div>

 <!-- 確定損益 -->
 <div id="realized" class="v stack">
  <div id="realizedUsd" class="num">--</div>
  <div class="sub">USD</div>
 </div>

 <!-- 勝率 -->
 <div id="winrate" class="v">
  <span id="winrateValue" class="num">--</span>
 </div>

 <!-- 含み損益 -->
 <div id="pnl" class="v stack">
  <div id="pnlUsd" class="num">--</div>
  <div id="pnlJpy" class="sub"></div>
 </div>

 <!-- ドローダウン -->
 <div id="maxdd" class="v">
  <span id="maxddValue" class="num">--</span>
 </div>

 <!-- 資産推移グラフ -->
 <canvas id="equityChart" aria-label="資産推移グラフ"></canvas>

 <!-- グラフ関連情報 -->
 <div id="recordCount" class="v">
  <span id="countValue">--</span>
 </div>

 <div id="latestEquity" class="v">
  <span id="latestValue">--</span>
 </div>

 <!-- シグナル -->
 <div id="signal" class="v">
  <span id="signalValue" class="num">WAIT</span>
 </div>

 <!-- スコア -->
 <div id="score" class="v">
  <span id="scoreValue" class="num">--</span>
 </div>

 <!-- RSI -->
 <div id="rsi" class="v">
  <span id="rsiValue" class="num">--</span>
 </div>

 <!-- シグナル理由 -->
 <div id="reason" class="v">
  <span id="reasonValue">--</span>
 </div>

 <!-- フィボナッチ -->
 <div id="fib0" class="fib">--</div>
 <div id="fib236" class="fib">--</div>
 <div id="fib382" class="fib">--</div>
 <div id="fib50" class="fib">--</div>
 <div id="fib618" class="fib">--</div>
 <div id="fib786" class="fib">--</div>
 <div id="fib100" class="fib">--</div>

 <!-- 現在のポジション -->
 <div id="position" class="v">
  <span id="positionValue" class="num">--</span>
 </div>

 <!-- オープン損益 -->
 <div id="openPnl" class="v">
  <span id="openPnlValue" class="num">--</span>
 </div>

 <!-- エンジン状態 -->
 <div id="botStatus" class="engine">--</div>
 <div
