<script>
"use strict";

/* =========================================
   18. 基本設定
========================================= */

const USDJPY = 150;

const $ = id => document.getElementById(id);

let loading = false;
let lastData = null;
let lastLoadSuccess = false;

/* =========================================
   19. JSONデータ取得
========================================= */

function get(o, paths, def = null){

 for(const p of paths){

  let v = o;

  for(const k of p.split(".")){

   if(v == null){
    v = undefined;
    break;
   }

   v = v[k];
  }

  if(
   v !== undefined &&
   v !== null &&
   v !== ""
  ){
   return v;
  }
 }

 return def;
}

function n(v){

 if(
  v === null ||
  v === undefined ||
  v === ""
 ){
  return null;
 }

 const x = Number(v);

 return Number.isFinite(x) ? x : null;
}

/* =========================================
   20. 金額フォーマット
========================================= */

function fmt(v, d = 2){

 const x = n(v);

 if(x === null){
  return "--";
 }

 return x.toLocaleString("en-US",{
  minimumFractionDigits:d,
  maximumFractionDigits:d
 });
}

function usd(v){

 const x = n(v);

 if(x === null){
  return "--";
 }

 return "$" + fmt(x);
}

function jpy(v){

 const x = n(v);

 if(x === null){
  return "";
 }

 return "約¥" +
  Math.round(x * USDJPY).toLocaleString("ja-JP");
}

function signed(v){

 const x = n(v);

 if(x === null){
  return "--";
 }

 return (x > 0 ? "+" : "") + fmt(x);
}

function put(id,v){

 const el = $(id);

 if(!el){
  return;
 }

 el.textContent =
  v === null || v === undefined || v === ""
   ? "--"
   : String(v);
}

/* =========================================
   21. プラス・マイナスの色
========================================= */

function color(id,v){

 const el = $(id);
 const x = n(v);

 el.classList.remove("good","bad");

 if(x !== null){
  el.classList.add(
   x >= 0 ? "good" : "bad"
  );
 }
}

/* =========================================
   22. 売買方向の統一
========================================= */

function side(v){

 const s = String(v ?? "WAIT").toUpperCase();

 if(
  s.includes("LONG") ||
  s === "BUY"
 ){
  return "LONG";
 }

 if(
  s.includes("SHORT") ||
  s === "SELL"
 ){
  return "SHORT";
 }

 return "WAIT";
}

/* =========================================
   23. 文字幅を実測して自動調整
========================================= */

/*
 * 今回の重要修正。
 *
 * 以前の方式では、文字自体のscrollWidthと
 * 親要素のclientWidthだけで判定していた。
 *
 * 今回は親要素の幅を明示的に取得し、
 * 文字の実際の描画幅も測定して調整する。
 *
 * BTC価格の桁数が増えた場合にも対応する。
 */

function measureTextWidth(el){

 const text = el.textContent || "";

 if(!text){
  return 0;
 }

 const style = getComputedStyle(el);

 const canvas = measureTextWidth.canvas ||
  (measureTextWidth.canvas = document.createElement("canvas"));

 const ctx = canvas.getContext("2d");

 if(!ctx){
  return el.scrollWidth;
 }

 ctx.font = [
  style.fontWeight,
  style.fontSize,
  style.fontFamily
 ].join(" ");

 let width = ctx.measureText(text).width;

 const spacing = parseFloat(style.letterSpacing);

 if(Number.isFinite(spacing) && text.length > 1){
  width += spacing * (text.length - 1);
 }

 return Math.max(width, el.scrollWidth);
}

function fitText(id,minSize = 5,maxSize = 16){

 const el = $(id);

 if(!el){
  return;
 }

 const parent = el.parentElement;

 if(!parent){
  return;
 }

 /*
  * 表示枠の内側の実際の幅。
  */
 const available = parent.clientWidth;

 if(available <= 0){
  return;
 }

 /*
  * 元のCSSサイズを取得。
  */
 el.style.fontSize = "";

 const computed = parseFloat(
  getComputedStyle(el).fontSize
 );

 let size = Math.min(
  Number.isFinite(computed) ? computed : maxSize,
  maxSize
 );

 /*
  * 幅に収まるまで0.5pxずつ縮小。
  */
 for(let i = 0; i < 40; i++){

  el.style.fontSize = size + "px";

  const textWidth = measureTextWidth(el);

  if(textWidth <= available - 2){
   break;
  }

  if(size <= minSize){
   break;
  }

  size -= 0.5;
 }

 /*
  * 最小サイズを下回らないようにする。
  */
 size = Math.max(minSize,size);

 el.style.fontSize = size + "px";

 /*
  * 文字幅が枠より大きい場合も、
  * 要素自体を親要素の幅に制限する。
  */
 el.style.maxWidth = "100%";
}

/* =========================================
   24. 表示全体の自動調整
========================================= */

function fitAllText(){

 /*
  * BTC価格を最優先。
  */
 fitText("priceUsd",4.5,12);

 /*
  * 日本円換算。
  */
 fitText("priceJpy",4,9);

 /*
  * 総資産。
  */
 fitText("equityUsd",4.5,14);
 fitText("equityJpy",4,9);

 /*
  * 確定損益。
  */
 fitText("realizedUsd",4.5,14);

 /*
  * 勝率・含み損益・DD。
  */
 fitText("winrateValue",5,15);
 fitText("pnlUsd",4.5,13);
 fitText("pnlJpy",4,9);
 fitText("maxddValue",5,14);

 /*
  * シグナル関連。
  */
 fitText("signalValue",5,14);
 fitText("scoreValue",5,14);
 fitText("rsiValue",5,13);

 /*
  * ポジション関連。
  */
 fitText("positionValue",4.5,12);
 fitText("openPnlValue",4.5,12);

 /*
  * グラフ下部。
  */
 fitText("countValue",5,12);
 fitText("latestValue",4.5,12);
}

/* =========================================
   25. 取引履歴
========================================= */

function tradesOf(d){

 const a = get(
  d,
  [
   "recent_trades",
   "paper_trades",
   "trades",
   "closed_trades"
  ],
  []
 );

 return Array.isArray(a) ? a : [];
}

function pnlOf(t){

 return n(
  get(
   t,
   [
    "net_pnl",
    "pnl",
    "profit",
    "realized_pnl",
    "realised_pnl"
   ]
  )
 );
}

function closed(a){

 return a.filter(t => {

  if(!t || typeof t !== "object"){
   return false;
  }

  return (
   t.exit_price != null ||
   t.exit_time != null ||
   t.closed_at != null ||
   String(
    get(t,["status","state"],"")
   ).toLowerCase().includes("closed")
  );
 });
}

/* =========================================
   26. 資産履歴
========================================= */

function historyOf(d){

 const a = get(
  d,
  [
   "equity_history",
   "equity_curve",
   "balance_history",
   "history",
   "snapshots"
  ],
  []
 );

 if(!Array.isArray(a)){
  return [];
 }

 return a
  .map(x => {

   if(typeof x === "number"){
    return x;
   }

   return n(
    get(
     x,
     [
      "marked_equity",
      "equity",
      "balance",
      "value",
      "account_value"
     ]
    )
   );
  })
  .filter(x => x !== null && x > 0)
  .slice(-120);
}

/* =========================================
   27. 資産推移グラフ
========================================= */

function draw(values){

 const cv = $("equityChart");

 const rect = cv.getBoundingClientRect();

 const dpr = Math.min(
  window.devicePixelRatio || 1,
  2
 );

 const w = Math.max(1,rect.width);
 const h = Math.max(1,rect.height);

 cv.width = Math.round(w * dpr);
 cv.height = Math.round(h * dpr);

 const ctx = cv.getContext("2d");

 if(!ctx){
  return;
 }

 ctx.setTransform(dpr,0,0,dpr,0,0);
 ctx.clearRect(0,0,w,h);

 if(!Array.isArray(values) || values.length < 2){
  return;
 }

 let min = Math.min(...values);
 let max = Math.max(...values);

 if(max - min < 0.000001){
  min -= 1;
  max += 1;
 }

 const pad = 3;

 const points = values.map((v,i) => ({
  x:pad + i / (values.length - 1) * (w - pad * 2),
  y:pad + (max - v) / (max - min) * (h - pad * 2)
 }));

 /*
  * グラフの面。
  */
 ctx.beginPath();

 points.forEach((p,i) => {

  if(i === 0){
   ctx.moveTo(p.x,p.y);
  }else{
   ctx.lineTo(p.x,p.y);
  }
 });

 ctx.lineTo(points[points.length - 1].x,h);
 ctx.lineTo(points[0].x,h);
 ctx.closePath();

 const gradient = ctx.createLinearGradient(0,0,0,h);

 gradient.addColorStop(0,"rgba(239,64,177,.25)");
 gradient.addColorStop(1,"rgba(173,110,241,.02)");

 ctx.fillStyle = gradient;
 ctx.fill();

 /*
  * グラフ線。
  */
 ctx.beginPath();

 points.forEach((p,i) => {

  if(i === 0){
   ctx.moveTo(p.x,p.y);
  }else{
   ctx.lineTo(p.x,p.y);
  }
 });

 ctx.strokeStyle = "#e546b0";
 ctx.lineWidth = Math.max(1.5,w * .005);
 ctx.lineJoin = "round";
 ctx.lineCap = "round";
 ctx.stroke();

 /*
  * 最新値のマーカー。
  */
 const last = points[points.length - 1];

 ctx.beginPath();
 ctx.arc(
  last.x,
  last.y,
  Math.max(2,w * .009),
  0,
  Math.PI * 2
 );

 ctx.fillStyle = "#8245db";
 ctx.fill();
}

/* =========================================
   28. フィボナッチ計算
========================================= */

function fibs(d){

 const fib = get(
  d,
  [
   "signal.fibonacci",
   "fibonacci",
   "fib"
  ]
 );

 if(!fib){
  return [null,null,null,null,null,null,null];
 }

 const levels = get(fib,["levels"],null);

 /*
  * levelsがオブジェクト形式。
  */
 if(levels && typeof levels === "object"){

  const hi = n(
   get(fib,["swing_high","high"])
  );

  const lo = n(
   get(fib,["swing_low","low"])
  );

  const v236 = n(
   get(levels,["0.236","23.6","236"])
  );

  const v382 = n(
   get(levels,["0.382","38.2","382"])
  );

  const v500 = n(
   get(levels,["0.5","0.500","50","50.0"])
  );

  const v618 = n(
   get(levels,["0.618","61.8","618"])
  );

  const v786 = n(
   get(levels,["0.786","78.6","786"])
  );

  if(
   [v236,v382,v500,v618,v786].some(
    v => v !== null
   )
  ){

   return [
    hi,
    v236,
    v382,
    v500,
    v618,
    v786,
    lo
   ];
  }
 }

 /*
  * 配列形式にも対応。
  */
 if(Array.isArray(fib)){

  const vals = fib.map(n);

  if(vals.length >= 7){
   return vals.slice(0,7);
  }
 }

 /*
  * 24時間高値・安値からの参考計算。
  */
 const hi = n(
  get(d,["high_24h","market.high_24h"])
 );

 const lo = n(
  get(d,["low_24h","market.low_24h"])
 );

 if(
  hi !== null &&
  lo !== null &&
  hi > lo
 ){

  const range = hi - lo;

  return [
   hi,
   hi - range * .236,
   hi - range * .382,
   hi - range * .5,
   hi - range * .618,
   hi - range * .786,
   lo
  ];
 }

 return [null,null,null,null,null,null,null];
}

/* =========================================
   29. 取引履歴描画
========================================= */

function renderTrades(all){

 const box = $("tradeRows");

 box.replaceChildren();

 all.slice(-4).reverse().forEach(t => {

  const row = document.createElement("div");

  row.className = "trade";

  const p = pnlOf(t);

  const time = String(
   get(
    t,
    [
     "exit_time",
     "closed_at",
     "timestamp",
     "time",
     "entry_time"
    ],
    "--"
   )
  )
   .replace("T"," ")
   .replace("Z","")
   .slice(0,16);

  const direction = side(
   get(
    t,
    [
     "side",
     "direction",
     "position",
     "type"
    ],
    "--"
   )
  );

  const reason = String(
   get(
    t,
    [
     "reason",
     "exit_reason",
     "close_reason",
     "strategy"
    ],
    "--"
   )
  );

  const values = [
   time,
   direction,
   p === null ? "--" : signed(p),
   reason
  ];

  values.forEach((v,k) => {

   const span = document.createElement("span");

   span.textContent = String(v);
   span.title = String(v);

   if(k === 1){

    if(direction === "LONG"){
     span.style.color = "#d62b98";
    }

    if(direction === "SHORT"){
     span.style.color = "#3478d8";
    }
   }

   if(k === 2 && p !== null){

    span.style.color =
     p >= 0 ? "#d62b98" : "#3478d8";
   }

   row.appendChild(span);
  });

  box.appendChild(row);
 });
}

/* =========================================
   30. メイン画面描画
========================================= */

function render(d){

 if(!d || typeof d !== "object"){
  throw new Error("JSONデータの形式が正しくありません。");
 }

 lastData = d;

 /*
  * 価格と総資産。
  */
 const price = n(
  get(
   d,
   [
    "price",
    "market.price",
    "btc_price"
   ]
  )
 );

 const equity = n(
  get(
   d,
   [
    "marked_equity",
    "equity",
    "metrics.equity"
   ]
  )
 );

 const initial = n(
  get(
   d,
   [
    "initial_equity",
    "initial_bankroll"
   ],
   100
  )
 ) ?? 100;

 /*
  * 取引履歴と勝率。
  */
 const all = tradesOf(d);
 const closedTrades = closed(all);

 const pnlValues = closedTrades
  .map(pnlOf)
  .filter(v => v !== null);

 const wins = pnlValues.filter(v => v > 0).length;

 let winrate = n(
  get(
   d,
   [
    "metrics.win_rate",
    "win_rate",
    "winrate"
   ]
  )
 );

 if(winrate !== null && winrate >= 0 && winrate <= 1){
  winrate *= 100;
 }

 if(winrate === null && pnlValues.length > 0){
  winrate = wins / pnlValues.length * 100;
 }

 /*
  * 確定損益。
  */
 const realized = n(
  get(
   d,
   [
    "realized_pnl",
    "metrics.total_net_pnl"
   ]
  )
 ) ?? pnlValues.reduce((a,b) => a + b,0);

 /*
  * オープンポジション。
  */
 const position = get(
  d,
  [
   "position",
   "open_position",
   "open_trade"
  ],
  null
 );

 const unrealized = n(
  get(
   d,
   [
    "unrealized_pnl",
    "position.unrealized_pnl",
    "position.unrealized_pnl_usd",
    "open_pnl"
   ]
  )
 ) ?? 0;

 /*
  * 最大ドローダウン。
  * bot.py側に最大値があれば優先する。
  */
 const dd = n(
  get(
   d,
   [
    "max_drawdown_pct",
    "risk.max_drawdown_pct",
    "metrics.max_drawdown_pct",
    "risk.drawdown_pct",
    "current_drawdown_pct"
   ]
  )
 );

 /*
  * BTC価格と日本円換算。
  */
 put(
  "priceUsd",
  price === null ? "--" : usd(price)
 );

 put(
  "priceJpy",
  price === null ? "" : jpy(price)
 );

 /*
  * 総資産。
  */
 put(
  "equityUsd",
  equity === null ? "--" : usd(equity)
 );

 put(
  "equityJpy",
  equity === null ? "" : jpy(equity)
 );

 /*
  * 確定損益。
  */
 put("realizedUsd",signed(realized));
 color("realizedUsd",realized);

 /*
  * 勝率。
  */
 put(
  "winrateValue",
  winrate === null ? "--" : winrate.toFixed(1) + "%"
 );

 /*
  * 含み損益。
  */
 put("pnlUsd",signed(unrealized));
 put("pnlJpy",jpy(unrealized));

 color("pnlUsd",unrealized);

 /*
  * ドローダウン。
  */
 put(
  "maxddValue",
  dd === null ? "--" : Math.abs(dd).toFixed(2) + "%"
 );

 /*
  * 売買シグナル。
  */
 const signal = side(
  get(
   d,
   [
    "signal.direction",
    "signal",
    "current_signal"
   ],
   "WAIT"
  )
 );

 const score = n(
  get(d,["signal.score"])
 );

 const rsi = n(
  get(
   d,
   [
    "signal.rsi",
    "indicators.rsi_15m",
    "rsi_15m"
   ]
  )
 );

 put("signalValue",signal);

 put(
  "scoreValue",
  score === null ? "--" : score
 );

 put(
  "rsiValue",
  rsi === null ? "--" : rsi.toFixed(1)
 );

 $("signalValue").classList.remove("good","bad");

 if(signal === "LONG"){
  $("signalValue").classList.add("good");
 }

 if(signal === "SHORT"){
  $("signalValue").classList.add("bad");
 }

 /*
  * シグナル理由。
  */
 const reasons = get(
  d,
  [
   "signal.reasons",
   "signal.reason"
  ],
  []
 );

 let reasonText = "";

 if(Array.isArray(reasons)){

  reasonText = reasons
   .filter(Boolean)
   .slice(0,2)
   .join("・");

 }else if(typeof reasons === "string"){

  reasonText = reasons;
 }

 put(
  "reasonValue",
  reasonText || "理由データなし"
 );

 /*
  * フィボナッチ。
  */
 const fibValues = fibs(d);

 const fibIds = [
  "fib0",
  "fib236",
  "fib382",
  "fib50",
  "fib618",
  "fib786",
  "fib100"
 ];

 fibIds.forEach((id,i) => {

  const value = fibValues[i];

  put(
   id,
   value === null || value === undefined
    ? "--"
    : fmt(value,0)
  );
 });

 /*
  * ポジション方向。
  */
 let positionSide = "WAIT";

 if(position && typeof position === "object"){

  positionSide = side(
   get(
    position,
    [
     "side",
     "direction",
     "type"
    ],
    "WAIT"
   )
  );

 }else if(position){

  positionSide = side(position);
 }

 put(
  "positionValue",
  positionSide === "WAIT" ? "NONE" : positionSide
 );

 put("openPnlValue",signed(unrealized));

 color("openPnlValue",unrealized);

 /*
  * エンジン状態。
  */
 const marketStatus = String(
  get(d,["market_status"],"--")
 );

 put(
  "botStatus",
  marketStatus === "OK" ? "OK" : marketStatus
 );

 /*
  * 時間足の方向。
  */
 put(
  "status15m",
  get(
   d,
   [
    "timeframes.15m.direction",
    "signal.trend_15m"
   ],
   "--"
  )
 );

 put(
  "status1h",
  get(
   d,
   [
    "timeframes.1h.direction",
    "signal.trend_1h"
   ],
   "--"
  )
 );

 put(
  "status4h",
  get(
   d,
   [
    "timeframes.4h.direction",
    "signal.trend_4h"
   ],
   "--"
  )
 );

 /*
  * 資産グラフ。
  */
 let history = historyOf(d);

 if(history.length < 2 && equity !== null){
  history = [initial,equity];
 }

 draw(history);

 put("countValue",history.length);

 put(
  "latestValue",
  equity === null ? "--" : usd(equity)
 );

 /*
  * HPバー。
  */
 const hpPercent =
  equity !== null && initial > 0
   ? equity / initial * 100
   : 0;

 $("hpFill").style.width =
  Math.max(0,Math.min(100,hpPercent)) + "%";

 /*
  * XPバー。
  */
 const totalWins = n(
  get(
   d,
   [
    "metrics.wins",
    "rpg.total_wins",
    "total_wins"
   ]
  )
 ) ?? wins;

 const xpPercent =
  ((totalWins % 10 + 10) % 10) * 10;

 $("xpFill").style.width = xpPercent + "%";

 /*
  * 最新取引を表示。
  */
 renderTrades(all);

 /*
  * 更新時刻。
  */
 const generated = get(
  d,
  [
   "generated_at",
   "updated_at",
   "timestamp"
  ]
 );

 let timestampText = "更新時刻不明";

 if(generated){

  const date = new Date(generated);

  if(!Number.isNaN(date.getTime())){

   timestampText = "更新: " +
    date.toLocaleString("ja-JP",{
     month:"2-digit",
     day:"2-digit",
     hour:"2-digit",
     minute:"2-digit"
    });
  }
 }

 put(
  "updated",
  timestampText + " ｜ PAPER ONLY ｜ 60秒ごとに更新"
 );

 /*
  * DOM反映後に文字サイズを調整。
  */
 requestAnimationFrame(() => {
  fitAllText();
 });
}

/* =========================================
   31. JSON読み込み処理
========================================= */

async function fetchJson(path){

 const response = await fetch(
  path + "?t=" + Date.now(),
  {
   cache:"no-store"
  }
 );

 if(!response.ok){
  throw new Error(
   path + " HTTP " + response.status
  );
 }

 return await response.json();
}

async function load(){

 if(loading){
  return;
 }

 loading = true;

 const errorBox = $("error");

 const paths = [
  "./data.json",
  "./docs/data.json",
  "./state.json",
  "./docs/state.json"
 ];

 const failures = [];

 try{

  for(const path of paths){

   try{

    const data = await fetchJson(path);

    if(!data || typeof data !== "object"){

     failures.push(
      path + ": JSON形式が不正"
     );

     continue;
    }

    const price = n(
     get(
      data,
      [
       "price",
       "market.price",
       "btc_price"
      ]
     )
    );

    const equity = n(
     get(
      data,
      [
       "marked_equity",
       "equity",
       "metrics.equity"
      ]
     )
    );

    /*
     * 価格も資産もないデータは候補から除外。
     */
    if(price === null && equity === null){

     failures.push(
      path + ": 価格・資産データが見つからない"
     );

     continue;
    }

    render(data);

    lastLoadSuccess = true;

    errorBox.style.display = "none";

    return;

   }catch(e){

    failures.push(
     path + ": " + String(e.message || e)
    );
   }
  }

  /*
   * 読み込みに失敗したときは、
   * 直前に表示できたデータを消さない。
   */
  errorBox.style.display = "block";

  errorBox.textContent =
   "データを読み込めません。GitHub Pagesの公開先と、" +
   "docs/data.json の存在を確認してください。";

  if(!lastLoadSuccess){

   put(
    "updated",
    "データ待機中 ｜ GitHub Actionsの実行結果を確認してください"
   );
  }

  console.warn(
   "BTC冒険記 データ読み込みエラー:",
   failures
  );

 }finally{

  loading = false;
 }
}

/* =========================================
   32. 初回起動
========================================= */

load();

/* =========================================
   33. 定期更新
========================================= */

setInterval(() => {
 load();
},60000);

   34. 画面サイズ変更
========================================= */

window.addEventListener("resize",() => {

 if(lastData){

  requestAnimationFrame(() => {

   const history = historyOf(lastData);

   draw(history);

   fitAllText();
  });
 }
});

);
