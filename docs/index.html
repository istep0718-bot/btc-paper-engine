
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>萌え萌えキュン♡ BTC冒険記</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#fff0fb}
body{font-family:Arial,"Hiragino Kaku Gothic ProN",Meiryo,sans-serif}
#stage{
  position:relative;width:100%;max-width:1536px;margin:auto;
  aspect-ratio:1536/1024;overflow:hidden;background:#ffe9fa;
}
#reference{
  position:absolute;inset:0;width:100%;height:100%;object-fit:fill;
}
.overlay{
  position:absolute;overflow:hidden;
  color:#392477;font-size:clamp(7px,1.05vw,15px);
  font-weight:700;text-align:center;
  display:flex;align-items:center;justify-content:center;
  overflow-wrap:anywhere;
}
.value{
  background:rgba(255,250,255,.96);
  border:1px solid #f0b9e8;border-radius:5px;
  padding:0 2px;min-width:0;
}
#status{
 position:absolute;left:78%;top:1%;width:20%;height:3%;
 font-size:clamp(7px,.8vw,11px);color:#6739a5;
}
#price{left:14.5%;top:34.7%;width:8.8%;height:3.1%}
#price-yen{left:14.5%;top:37.6%;width:8.8%;height:2.6%}
#equity{left:24.4%;top:34.7%;width:8.8%;height:3.1%}
#equity-yen{left:24.4%;top:37.6%;width:8.8%;height:2.6%}
#pnl{left:34.3%;top:34.7%;width:8.4%;height:3.1%}
#pnl-yen{left:34.3%;top:37.6%;width:8.4%;height:2.6%}
#winrate{left:44.3%;top:34.7%;width:7.9%;height:3.1%}
#closed{left:44.3%;top:37.6%;width:7.9%;height:2.6%}
#unrealized{left:54.1%;top:34.7%;width:7.9%;height:3.1%}
#unrealized-yen{left:54.1%;top:37.6%;width:7.9%;height:2.6%}
#dd{left:64%;top:34.7%;width:7.8%;height:3.1%}
#pf{left:64%;top:37.6%;width:7.8%;height:2.6%}
#chart-area{
 position:absolute;left:18.9%;top:53%;width:33.4%;height:16.8%;
 background:rgba(255,252,255,.96);border:1px solid #f3c5ec;
 border-radius:3px;
}
#chart{width:100%;height:100%;display:block}
#chart-note{
 position:absolute;left:24%;top:71.2%;width:26%;height:2.2%;
 background:rgba(255,247,255,.95);font-size:clamp(6px,.7vw,10px);
}
#signal{left:56.4%;top:57.5%;width:6.2%;height:5.2%;
 font-size:clamp(10px,1.6vw,23px);color:#14a88d}
#score{left:63.2%;top:57.5%;width:6.4%;height:5.2%}
#rsi{left:69.7%;top:57.5%;width:6.5%;height:5.2%}
#reason{
 left:55.7%;top:64.3%;width:20.9%;height:4.3%;
 background:rgba(255,250,255,.97);font-size:clamp(6px,.75vw,10px);
}
#current-price{left:79.5%;top:60%;width:17.5%;height:2.5%;
 font-size:clamp(7px,.9vw,12px)}
#fib{
 position:absolute;left:79.3%;top:62.4%;width:12%;height:18%;
 display:flex;flex-direction:column;justify-content:space-around;
 background:rgba(255,249,255,.96);border-radius:5px;
 border:1px solid #f5c9ed;padding:1px 4px;
 font-size:clamp(6px,.72vw,10px);color:#55338b
}
.fibrow{display:flex;justify-content:space-between;gap:3px}
#trade-body{
 position:absolute;left:33.8%;top:81.2%;width:43.5%;height:14.4%;
 background:rgba(255,252,255,.97);overflow:hidden;
 border:1px solid #efc0e8;border-radius:4px;
}
#trades{width:100%;height:100%;border-collapse:collapse;
 font-size:clamp(5px,.65vw,9px);color:#38265f;table-layout:fixed}
#trades th,#trades td{
 border-bottom:1px solid #f1d8ef;padding:2px 1px;
 text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis
}
#trades th{background:#fce9f9;color:#7952a1}
#trades th:nth-child(1){width:17%}
#trades th:nth-child(2){width:9%}
#trades th:nth-child(3){width:9%}
#trades th:nth-child(4){width:13%}
#trades th:nth-child(5){width:13%}
#trades th:nth-child(6){width:13%}
#trades th:nth-child(7){width:13%}
#trades th:nth-child(8){width:13%}
.win{color:#079f8a}.loss{color:#ed5ba9}
#battle{
 position:absolute;left:15%;top:81.3%;width:16.5%;height:14%;
 display:flex;align-items:center;justify-content:center;
 background:rgba(255,249,255,.95);border:1px solid #efc0e8;
 border-radius:9px;font-size:clamp(7px,.85vw,12px);text-align:center;
}
#battle-text{line-height:1.8}
#battle-pos{font-size:clamp(10px,1.2vw,17px);color:#6a3ca1}
#last-update{
 position:absolute;left:65%;top:97%;width:30%;height:1.7%;
 color:#775b9d;background:rgba(255,249,255,.75);
 font-size:clamp(5px,.55vw,8px);text-align:right;
}
@media(max-width:600px){
 #status{font-size:7px}
 #trade-body{height:14.4%}
}
</style>
</head>
<body>
<div id="stage">
  <img id="reference" src="./reference-dashboard.jpeg"
       alt="BTC冒険記の見本レイアウト">
  <div id="status">DATA: 読み込み中</div>

  <div id="price" class="overlay value">--</div>
  <div id="price-yen" class="overlay value">¥ --</div>
  <div id="equity" class="overlay value">--</div>
  <div id="equity-yen" class="overlay value">¥ --</div>
  <div id="pnl" class="overlay value">--</div>
  <div id="pnl-yen" class="overlay value">¥ --</div>
  <div id="winrate" class="overlay value">--</div>
  <div id="closed" class="overlay value">決済回数: --</div>
  <div id="unrealized" class="overlay value">--</div>
  <div id="unrealized-yen" class="overlay value">¥ --</div>
  <div id="dd" class="overlay value">--</div>
  <div id="pf" class="overlay value">PF: --</div>

  <div id="chart-area">
    <svg id="chart" viewBox="0 0 500 170"
      preserveAspectRatio="none"></svg>
  </div>
  <div id="chart-note" class="overlay">
    履歴: -- 件 / 最新資産: --
  </div>

  <div id="signal" class="overlay value">WAIT</div>
  <div id="score" class="overlay value">-- / 100</div>
  <div id="rsi" class="overlay value">--</div>
  <div id="reason" class="overlay">シグナル情報を読み込み中…</div>

  <div id="current-price" class="overlay value">現在価格: --</div>
  <div id="fib">
    <div class="fibrow"><span>0%</span><b id="fib0">--</b></div>
    <div class="fibrow"><span>23.6%</span><b id="fib1">--</b></div>
    <div class="fibrow"><span>38.2%</span><b id="fib2">--</b></div>
    <div class="fibrow"><span>50%</span><b id="fib3">--</b></div>
    <div class="fibrow"><span>61.8%</span><b id="fib4">--</b></div>
    <div class="fibrow"><span>78.6%</span><b id="fib5">--</b></div>
    <div class="fibrow"><span>100%</span><b id="fib6">--</b></div>
  </div>

  <div id="battle">
    <div id="battle-text">
      <div>⚔️ 現在のバトル</div>
      <div id="battle-pos">ポジションなし</div>
      <div id="battle-pnl">含み損益: --</div>
    </div>
  </div>

  <div id="trade-body">
    <table id="trades">
      <thead><tr>
        <th>日時</th><th>結果</th><th>倍率</th><th>エントリー</th>
        <th>決済</th><th>損益 USD</th><th>損益 円</th><th>理由</th>
      </tr></thead>
      <tbody id="trade-rows">
        <tr><td colspan="8">取引履歴を読み込み中…</td></tr>
      </tbody>
    </table>
  </div>
  <div id="last-update">更新: --</div>
</div>

<script>
"use strict";
const $=id=>document.getElementById(id);
let fx=null,last=null;

function n(v){
 if(v===null||v===undefined||v==="")return null;
 const x=Number(v);return Number.isFinite(x)?x:null;
}
function pick(...v){return v.find(x=>x!==null&&x!==undefined&&x!=="")??null}
function usd(v){
 const x=n(v);
 return x===null?"--":"$"+x.toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});
}
function jpy(v){
 const x=n(v);
 return x===null||fx===null?"¥ --":"¥"+Math.round(x*fx).toLocaleString("ja-JP");
}
function pct(v){
 const x=n(v);return x===null?"--":x.toFixed(1)+"%";
}
function put(id,v){$(id).textContent=v===null||v===undefined?"--":String(v)}
function dt(v){
 if(!v)return "--";
 const d=new Date(v);
 return Number.isNaN(d.getTime())?String(v):d.toLocaleString("ja-JP",{
  month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",hour12:false
 });
}
function priceOf(t){return n(pick(t.entry_price,t.entry,t.open_price))}
function exitOf(t){return n(pick(t.exit_price,t.exit,t.close_price))}
function pnlOf(t){return n(pick(t.net_pnl_usd,t.pnl_usd,t.pnl,t.profit_usd,t.realized_pnl_usd))}
function timeOf(t){return pick(t.close_time,t.closed_at,t.exit_time,t.timestamp,t.time,t.open_time)}
function drawChart(history){
 const svg=$("chart");svg.innerHTML="";
 const rows=(Array.isArray(history)?history:[]).map(x=>({
  t:pick(x.timestamp,x.time,x.date,x.generated_at),
  v:n(pick(x.equity_usd,x.equity,x.balance_usd))
 })).filter(x=>x.v!==null);
 put("chart-note","履歴: "+rows.length+" 件 / 最新資産: "+(rows.length?usd(rows[rows.length-1].v):"--"));
 if(rows.length<2){
  svg.innerHTML='<text x="250" y="85" text-anchor="middle" fill="#9d7ab4" font-size="12">記録された資産履歴が2件以上になるとグラフが表示されます</text>';
  return;
 }
 const vals=rows.map(x=>x.v);
 let min=Math.min(...vals),max=Math.max(...vals);
 if(min===max){min-=1;max+=1}
 const pad=(max-min)*.08;min-=pad;max+=pad;
 const X=i=>10+i*480/(vals.length-1);
 const Y=v=>8+(max-v)*150/(max-min);
 const line=vals.map((v,i)=>(i?"L":"M")+X(i)+" "+Y(v)).join(" ");
 const ns="http://www.w3.org/2000/svg";
 const add=(tag,attrs)=>{
  const e=document.createElementNS(ns,tag);
  Object.entries(attrs).forEach(([k,v])=>e.setAttribute(k,v));
  svg.appendChild(e);return e;
 };
 for(let i=0;i<5;i++){
  const y=8+i*37.5;
  add("line",{x1:0,y1:y,x2:500,y2:y,stroke:"#efd8f2","stroke-width":1});
 }
 const defs=document.createElementNS(ns,"defs");
 defs.innerHTML='<linearGradient id="pinkfill" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#ee77ce" stop-opacity=".35"/><stop offset="100%" stop-color="#ee77ce" stop-opacity=".02"/></linearGradient>';
 svg.appendChild(defs);
 add("path",{d:line+" L 490 165 L 10 165 Z",fill:"url(#pinkfill)"});
 add("path",{d:line,fill:"none",stroke:"#d85cc1","stroke-width":2.5});
 add("circle",{cx:X(vals.length-1),cy:Y(vals[vals.length-1]),r:3.5,fill:"#e958bc"});
}
function renderTrades(trades){
 const body=$("trade-rows");body.innerHTML="";
 const list=(Array.isArray(trades)?trades:[]).slice().reverse().slice(0,5);
 if(!list.length){
  body.innerHTML='<tr><td colspan="8">決済済み取引はまだありません</td></tr>';return;
 }
 list.forEach(t=>{
  const p=pnlOf(t),dir=String(pick(t.direction,t.side,"--")).toUpperCase();
  const result=p===null?"--":p>0?"WIN":p<0?"LOSS":"DRAW";
  const values=[
   dt(timeOf(t)),result,
   pick(t.leverage,t.leverage_x)===null?"--":pick(t.leverage,t.leverage_x)+"x",
   usd(priceOf(t)),usd(exitOf(t)),usd(p),p===null?"--":jpy(p),
   pick(t.reason,t.exit_reason,t.signal_reason,"--")
  ];
  const tr=document.createElement("tr");
  values.forEach((v,i)=>{
   const td=document.createElement("td");td.textContent=v;
   if(i===1)td.className=p>0?"win":p<0?"loss":"";
   if(i===5||i===6)td.className=p>0?"win":p<0?"loss":"";
   tr.appendChild(td);
  });
  body.appendChild(tr);
 });
}
function render(d){
 last=d;
 const m=d.metrics||{},s=d.signal||{},r=d.risk||{};
 const hist=Array.isArray(d.equity_history)?d.equity_history:[];
 const trades=Array.isArray(d.recent_trades)?d.recent_trades:[];
 const price=n(d.price),eq=n(m.equity_usd),pnl=n(m.net_closed_pnl_usd);
 const wr=n(m.win_rate_pct),dd=n(m.drawdown_pct);
 put("status","● DATA CONNECTED · "+dt(d.generated_at));
 put("price",usd(price));put("price-yen",jpy(price));
 put("equity",usd(eq));put("equity-yen",jpy(eq));
 put("pnl",pnl===null?"--":(pnl>0?"+ ":"")+usd(pnl));
 put("pnl-yen",pnl===null?"¥ --":(pnl>0?"+ ":"")+jpy(pnl));
 put("winrate",pct(wr));
 put("closed","決済回数: "+pick(m.closed_trades,trades.length,"--"));
 put("unrealized",usd(m.open_unrealized_pnl_usd));
 put("unrealized-yen",jpy(m.open_unrealized_pnl_usd));
 put("dd",pct(dd));
 put("pf","PF: "+(n(m.profit_factor)===null?"--":n(m.profit_factor).toFixed(2)));
 const direction=String(pick(s.direction,"WAIT")).toUpperCase();
 put("signal",direction);
 $("signal").style.color=direction==="LONG"||direction==="BUY"?"#10a58a":direction==="SHORT"||direction==="SELL"?"#e65da7":"#8b70aa";
 put("score",n(s.score)===null?"--":Math.round(n(s.score))+" / 100");
 put("rsi",n(s.rsi_15m)===null?"--":n(s.rsi_15m).toFixed(1));
 const reasons=Array.isArray(s.reasons)?s.reasons.join(" / "):pick(s.reason,s.message,"BOTのシグナル情報");
 put("reason","理由: "+reasons);
 put("current-price","現在価格: "+usd(price));
 const open=d.open_trade;
 put("battle-pos",open?pick(open.direction,open.side,"ポジション保有中"):"ポジションなし");
 put("battle-pnl","含み損益: "+usd(m.open_unrealized_pnl_usd));
 drawChart(hist);renderTrades(trades);
 const levels=Array.isArray(d.fibonacci_levels)?d.fibonacci_levels:[];
 levels.slice(0,7).forEach((v,i)=>put("fib"+i,usd(pick(v.price,v.value,v))));
 put("last-update","最終更新: "+dt(d.generated_at));
}
async function load(){
 try{
  const res=await fetch("./data.json?t="+Date.now(),{cache:"no-store"});
  if(!res.ok)throw new Error("HTTP "+res.status);
  const data=await res.json();
  render(data);
 }catch(e){
  put("status","DATA ERROR");
  put("last-update","data.jsonを読み込めません");
  console.error(e);
 }
}
async function loadFX(){
 try{
  const r=await fetch("https://open.er-api.com/v6/latest/USD",{cache:"no-store"});
  if(!r.ok)throw Error("FX");
  const d=await r.json();
  fx=n(d.rates&&d.rates.JPY);
  if(last)render(last);
 }catch(e){console.warn("JPY conversion unavailable",e)}
}
$("reference").addEventListener("error",()=>{
 $("stage").innerHTML='<div style="padding:30px;color:#8b247e">見本画像が見つかりません。docs/reference-dashboard.jpeg が存在するか確認してください。</div>';
});
load();loadFX();setInterval(load,60000);
</script>
</body>
</html>
