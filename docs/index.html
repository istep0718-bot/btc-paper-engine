
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>萌え萌えキュン♡ BTC冒険記</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#fce8fa;color:#59357e;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif}
body{min-height:100vh}
#app{position:relative;width:100%;max-width:1024px;margin:auto;line-height:1}
#poster{display:block;width:100%;height:auto}
#overlay{position:absolute;inset:0;pointer-events:none}
.data{position:absolute;display:flex;align-items:center;justify-content:center;text-align:center;overflow:hidden;line-height:1.15;font-weight:800;text-shadow:0 1px 0 #fff;white-space:pre-line}
.num{font-size:clamp(9px,1.65vw,18px);color:#4c3986}
.small{font-size:clamp(7px,1.05vw,12px);font-weight:650}
.green{color:#079b85}.red{color:#d83f83}
.click{position:absolute;z-index:5;border:0;padding:0;background:transparent;cursor:pointer;pointer-events:auto;border-radius:8px}
.click:focus-visible{outline:3px solid #7c42bc}
#graphBox{position:absolute;left:23%;top:49.5%;width:43%;height:16.1%;background:#ffffffed;border:1px solid #efc9eb;border-radius:8px;overflow:hidden}
#chart{display:block;width:100%;height:100%}
#historyBox{position:absolute;left:21.4%;top:84.3%;width:76%;height:8.1%;background:#ffffffed;overflow:hidden;display:flex;flex-direction:column;justify-content:center;gap:3px;padding:3px 5px;font-size:clamp(6px,1vw,11px);line-height:1.25}
.hist{display:grid;grid-template-columns:1.5fr .6fr .8fr .8fr;gap:3px;align-items:center}
.hist span{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
#toast{display:none;position:fixed;z-index:30;bottom:16px;left:50%;transform:translateX(-50%);background:#783da0;color:white;border-radius:12px;padding:12px 16px;font-size:14px;max-width:90vw}
#settings{display:none;position:fixed;inset:0;z-index:40;background:#381d4f99;align-items:center;justify-content:center;padding:16px}
.dialog{width:min(420px,100%);padding:18px;background:#fff7ff;border:1px solid #e5b5e4;border-radius:16px;line-height:1.5;box-shadow:0 10px 40px #4b226655}
.dialog h2{font-size:20px;margin:0 0 10px}
.dialog label{display:block;font-size:13px;margin:10px 0}
.dialog input{width:100%;padding:10px;border:1px solid #ddb4dc;border-radius:8px;font-size:16px}
.dialog button{border:0;border-radius:9px;padding:10px 14px;background:#d94fa8;color:white;font-weight:800;margin:8px 6px 0 0}
#status{overflow-wrap:anywhere;font-size:12px}
</style>
</head>
<body>
<div id="app">
  <!-- GitHub docs フォルダに置いた元画像をそのまま使用 -->
  <img id="poster" src="./4628502E-AD19-40F8-AB34-A7FCDE4ACB05.png" alt="BTC冒険記ダッシュボード">

  <div id="overlay">
    <div class="data num" id="price" style="left:23%;top:27.2%;width:11%;height:2.6%">$ --</div>
    <div class="data small" id="priceJPY" style="left:23%;top:29.5%;width:11%;height:1.5%">¥ --</div>
    <div class="data num" id="equity" style="left:37%;top:27.2%;width:11%;height:2.6%">$ --</div>
    <div class="data small" id="equityJPY" style="left:37%;top:29.5%;width:11%;height:1.5%">¥ --</div>
    <div class="data num green" id="pnl" style="left:50.8%;top:27.2%;width:11%;height:2.6%">$ --</div>
    <div class="data small" id="pnlJPY" style="left:50.8%;top:29.5%;width:11%;height:1.5%">¥ --</div>

    <div class="data num" id="winrate" style="left:23%;top:37.2%;width:11%;height:2.4%">--%</div>
    <div class="data small" id="trades" style="left:22.4%;top:39.4%;width:12%;height:1.5%">決済 -- 回</div>
    <div class="data num" id="unreal" style="left:37%;top:37.2%;width:11%;height:2.4%">$ --</div>
    <div class="data small" id="unrealJPY" style="left:37%;top:39.4%;width:11%;height:1.5%">¥ --</div>
    <div class="data num" id="dd" style="left:50.8%;top:37.2%;width:11%;height:2.4%">--%</div>
    <div class="data small" id="pf" style="left:50.8%;top:39.4%;width:11%;height:1.5%">PF --</div>

    <div class="data small" id="hp" style="left:48%;top:18.9%;width:8%;height:2%">100 / 100</div>
    <div class="data small" id="xp" style="left:85%;top:17.6%;width:12%;height:1.7%">0 / 500 XP</div>
    <div class="data small" id="stage" style="left:87%;top:9.5%;width:10%;height:2%">STAGE 1</div>
    <div class="data small" id="level" style="left:87%;top:12.2%;width:10%;height:1.7%">Lv.1</div>
    <div class="data small" id="progress" style="left:89%;top:25.5%;width:8%;height:1.5%">0 / 10</div>

    <div class="data small" id="signal" style="left:69.3%;top:49.4%;width:8.7%;height:3%">WAIT</div>
    <div class="data small" id="score" style="left:79%;top:49.4%;width:8.7%;height:3%">--</div>
    <div class="data small" id="rsi" style="left:89%;top:49.4%;width:8.7%;height:3%">--</div>
    <div class="data small" id="reason" style="left:69.5%;top:53.4%;width:28%;height:4%">シグナルを読み込み中</div>
    <div class="data small" id="fibPrice" style="left:69.4%;top:62.2%;width:18%;height:2%">$ --</div>

    <div class="data small" id="build" style="left:47.7%;top:70.3%;width:14%;height:1.3%">--</div>
    <div class="data small" id="tf15" style="left:47.7%;top:72.1%;width:14%;height:1.3%">15m --</div>
    <div class="data small" id="tf1h" style="left:47.7%;top:73.8%;width:14%;height:1.3%">1h --</div>
    <div class="data small" id="tf4h" style="left:47.7%;top:75.5%;width:14%;height:1.3%">4h --</div>
    <div class="data small" id="updated" style="left:47.7%;top:77.1%;width:14%;height:1.3%">--</div>
    <div class="data small" id="position" style="left:24%;top:71.7%;width:20%;height:5%">ポジションなし</div>

    <div id="graphBox"><canvas id="chart"></canvas></div>
    <div id="historyBox">取引履歴を読み込み中…</div>

    <button class="click" aria-label="ホーム" style="left:2%;top:16.5%;width:18%;height:4.5%" data-action="home"></button>
    <button class="click" aria-label="バトルログ" style="left:2%;top:21.2%;width:18%;height:4.4%" data-action="trades"></button>
    <button class="click" aria-label="資産グラフ" style="left:2%;top:25.8%;width:18%;height:4.4%" data-action="assets"></button>
    <button class="click" aria-label="フィボナッチ" style="left:2%;top:30.5%;width:18%;height:4.4%" data-action="fib"></button>
    <button class="click" aria-label="設定" style="left:2%;top:35.2%;width:18%;height:4.4%" data-action="settings"></button>
    <button class="click" aria-label="フィボナッチ参考価格" style="left:72%;top:60%;width:21%;height:2.8%" data-action="fib"></button>
    <button class="click" aria-label="再読み込み" style="left:80%;top:91%;width:15%;height:2.5%" data-action="reload"></button>
  </div>
</div>

<div id="toast" role="status"></div>
<div id="settings">
  <div class="dialog">
    <h2>⚙️ ダッシュボード設定</h2>
    <p style="font-size:13px">公開JSONのURLと円換算レートを設定します。秘密鍵やウォレット情報は入力しないでください。</p>
    <label>データJSON URL<input id="dataUrl" value="./data.json"></label>
    <label>USD/JPY レート<input id="fx" type="number" min="1" value="150"></label>
    <label>初期資産 USD<input id="initial" type="number" min="0" value="100"></label>
    <button id="save">保存して再読込</button><button id="close">閉じる</button>
    <p id="status">データ未取得</p>
  </div>
</div>

<script>
"use strict";
const $=id=>document.getElementById(id);
let data=null,fx=150,initial=100;
const num=(...xs)=>{
  for(const x of xs){
    if(x!==null&&x!==undefined&&x!==""&&Number.isFinite(Number(x)))return Number(x);
  }
  return NaN;
};
const first=(...xs)=>xs.find(x=>x!==null&&x!==undefined&&x!=="");
const usd=n=>Number.isFinite(Number(n))?"$"+Number(n).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2}):"$ --";
const jpy=n=>Number.isFinite(Number(n))?"¥"+Math.round(Number(n)).toLocaleString("ja-JP"):"¥ --";
const fmt=n=>Number.isFinite(Number(n))?Number(n).toLocaleString("ja-JP",{maximumFractionDigits:2}):"--";
function text(id,value){$(id).textContent=String(value??"--")}
function escapeHTML(value){
  return String(value??"--").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function toast(message){
  text("toast",message);$("toast").style.display="block";
  setTimeout(()=>$("toast").style.display="none",2600);
}
function trend(value){
  const n=Number(value);
  if(n===1)return "上向き";
  if(n===-1)return "下向き";
  if(n===0)return "横ばい";
  return value??"--";
}
function drawChart(history){
  const canvas=$("chart"),box=$("graphBox");
  const w=Math.max(240,box.clientWidth),h=Math.max(100,box.clientHeight);
  const ratio=window.devicePixelRatio||1;
  canvas.width=w*ratio;canvas.height=h*ratio;
  const ctx=canvas.getContext("2d");
  ctx.setTransform(ratio,0,0,ratio,0,0);
  ctx.clearRect(0,0,w,h);

  const rows=(Array.isArray(history)?history:[])
    .map(item=>({
      time:item.time,
      value:num(item.equity_usd,item.equity,item.balance,item.value)
    }))
    .filter(item=>Number.isFinite(item.value));

  if(!rows.length){
    ctx.fillStyle="#795795";ctx.font="12px sans-serif";
    ctx.fillText("資産履歴データ待機中",8,20);
    return;
  }
  const values=rows.map(v=>v.value);
  let min=Math.min(...values),max=Math.max(...values);
  if(min===max){min-=0.1;max+=0.1}
  const pad={l:43,r:5,t:8,b:17},cw=w-pad.l-pad.r,ch=h-pad.t-pad.b;
  ctx.font="9px sans-serif";ctx.fillStyle="#795795";ctx.strokeStyle="#efd9ed";ctx.lineWidth=1;

  for(let i=0;i<4;i++){
    const y=pad.t+ch*i/3;
    ctx.beginPath();ctx.moveTo(pad.l,y);ctx.lineTo(w-pad.r,y);ctx.stroke();
    ctx.fillText("$"+(max-(max-min)*i/3).toFixed(2),1,y+3);
  }
  const points=rows.map((v,i)=>({
    x:pad.l+(rows.length===1?0:i/(rows.length-1))*cw,
    y:pad.t+(max-v.value)/(max-min)*ch
  }));
  const fill=ctx.createLinearGradient(0,pad.t,0,pad.t+ch);
  fill.addColorStop(0,"#f7a7d6aa");fill.addColorStop(1,"#f7a7d600");
  ctx.beginPath();
  points.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));
  ctx.lineTo(points[points.length-1].x,pad.t+ch);
  ctx.lineTo(points[0].x,pad.t+ch);ctx.closePath();
  ctx.fillStyle=fill;ctx.fill();

  ctx.beginPath();
  points.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));
  ctx.strokeStyle="#df4cae";ctx.lineWidth=2;ctx.stroke();

  const latest=values[values.length-1];
  ctx.fillStyle="#59357e";ctx.font="bold 10px sans-serif";
  ctx.fillText("最新 "+usd(latest),Math.max(pad.l,w-100),12);
}
function render(d){
  data=d||{};
  const m=data.metrics||{};
  const s=data.signal||{};
  const risk=data.risk||{};
  const open=data.open_trade||null;
  const trades=Array.isArray(data.recent_trades)?data.recent_trades:[];
  const closedCount=num(m.closed_trades,trades.length);
  const wins=num(m.wins,0),losses=num(m.losses,0);
  const price=num(data.price);
  const equity=num(m.equity_usd,initial);
  const pnl=num(m.net_closed_pnl_usd,equity-initial);
  const unreal=num(m.open_unrealized_pnl_usd,0);
  const rate=num(m.win_rate_pct,closedCount>0?wins/closedCount*100:NaN);
  const dd=num(m.drawdown_pct,risk.max_drawdown_pct);
  const pf=num(m.profit_factor);

  text("price",usd(price));text("priceJPY",jpy(price*fx));
  text("equity",usd(equity));text("equityJPY",jpy(equity*fx));
  text("pnl",usd(pnl));text("pnlJPY",jpy(pnl*fx));
  $("pnl").className="data num "+(pnl>=0?"green":"red");
  $("pnlJPY").className="data small "+(pnl>=0?"green":"red");

  text("winrate",Number.isFinite(rate)?rate.toFixed(2)+"%":"--%");
  text("trades","決済 "+fmt(closedCount)+" 回");
  text("unreal",usd(unreal));text("unrealJPY",jpy(unreal*fx));
  $("unreal").className="data num "+(unreal>=0?"green":"red");
  text("dd",Number.isFinite(dd)?dd.toFixed(2)+"%":"--%");
  text("pf",Number.isFinite(pf)? "PF "+pf.toFixed(2):"PF --");

  text("signal",first(s.direction,"WAIT"));
  text("score",Number.isFinite(num(s.score))?"Score "+s.score:"Score --");
  text("rsi",Number.isFinite(num(s.rsi_15m))?"RSI "+Number(s.rsi_15m).toFixed(2):"RSI --");

  const reasons=Array.isArray(s.reasons)?s.reasons:[];
  text("reason",reasons.length?reasons.join(" / "):"シグナル理由なし");

  text("build",first(data.build,"--"));
  text("tf15","15m "+trend(s.trend_15m));
  text("tf1h","1h "+trend(s.trend_1h));
  text("tf4h","4h "+trend(s.trend_4h));
  text("updated",first(data.generated_at,"--"));

  const openPnl=Number.isFinite(unreal)?unreal:0;
  if(open){
    text("position",open.direction+" "+fmt(open.qty_btc)+" BTC\n含み "+usd(openPnl));
  }else{
    text("position","ポジションなし\n含み "+usd(openPnl));
  }

  // 10勝ごとにステージが進むゲーム風表示。実取引の損益には影響しない。
  const stage=Math.floor(Math.max(0,wins)/10)+1;
  text("stage","STAGE "+stage);
  text("level","Lv."+stage);
  text("xp",(Math.max(0,wins)%10)*50+" / 500 XP");
  text("hp",Math.max(0,100-losses*10)+" / 100");
  text("progress",(Math.max(0,wins)%10)+" / 10");

  text("fibPrice",usd(price));
  drawChart(data.equity_history);

  if(!trades.length){
    $("historyBox").textContent="決済履歴はまだありません";
  }else{
    $("historyBox").innerHTML=trades.slice().reverse().slice(-4).reverse().map(t=>{
      const result=num(t.net_pnl_usd,0);
      const reason=first(t.close_reason,"--");
      const time=first(t.closed_at,t.opened_at,"--");
      const shortTime=String(time).replace("T"," ").slice(5,16);
      return '<div class="hist">'+
        '<span>'+escapeHTML(shortTime)+'</span>'+
        '<span>'+escapeHTML(t.direction)+'</span>'+
        '<span class="'+(result>=0?"green":"red")+'">'+escapeHTML(usd(result))+'</span>'+
        '<span>'+escapeHTML(reason)+'</span></div>';
    }).join("");
  }

  const status=[
    "JSON読込成功",
    "価格 "+usd(price),
    "仮想レバレッジ "+fmt(risk.virtual_leverage)+"x",
    risk.paper_only===true?"ペーパートレード専用":"取引モード確認要"
  ];
  text("status",status.join(" / "));
}
async function load(){
  const url=localStorage.getItem("btcImageDataUrl")||"./data.json";
  try{
    const response=await fetch(url+(url.includes("?")?"&":"?")+"_="+Date.now(),{cache:"no-store"});
    if(!response.ok)throw new Error("HTTP "+response.status);
    const json=await response.json();
    render(json);
  }catch(error){
    text("status","JSON読込エラー: "+error.message+"。設定と data.json の配置を確認してください。");
    if(!data){
      text("signal","NO DATA");
      text("reason","data.jsonを読み込めません");
      drawChart([]);
    }
  }
}

document.querySelectorAll("[data-action]").forEach(button=>{
  button.addEventListener("click",()=>{
    const action=button.dataset.action;
    if(action==="settings"){
      $("settings").style.display="flex";
      $("dataUrl").value=localStorage.getItem("btcImageDataUrl")||"./data.json";
      $("fx").value=fx;$("initial").value=initial;
    }else if(action==="reload"){
      load();toast("データを再読み込み中");
    }else if(action==="home"){
      window.scrollTo({top:0,behavior:"smooth"});toast("ホーム");
    }else if(action==="trades"){
      $("historyBox").scrollIntoView({behavior:"smooth",block:"center"});toast("バトルログ");
    }else if(action==="assets"){
      $("graphBox").scrollIntoView({behavior:"smooth",block:"center"});toast("資産グラフ");
    }else if(action==="fib"){
      const p=num(data?.price);
      toast(Number.isFinite(p)?"BTC価格 "+usd(p)+"（参考表示）":"価格データ待機中");
    }
  });
});

$("save").addEventListener("click",()=>{
  fx=num($("fx").value,150);
  initial=num($("initial").value,100);
  localStorage.setItem("btcImageDataUrl",$("dataUrl").value.trim()||"./data.json");
  $("settings").style.display="none";
  load();
});
$("close").addEventListener("click",()=>$("settings").style.display="none");

$("poster").addEventListener("error",()=>{
  toast("画像が見つかりません。docsフォルダの画像名を確認してください。");
});
window.addEventListener("resize",()=>{if(data)drawChart(data.equity_history)});
load();
setInterval(load,60000);
</script>
</body>
</html>
