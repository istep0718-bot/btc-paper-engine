#equityChart{position:absolute;z-index:4;left:23.7%;top:44.55%;width:41.2%;height:12.1%;display:block}

.trade{display:grid;grid-template-columns:1.2fr .55fr .72fr .72fr .65fr .95fr;gap:.15cqw;min-height:22%;border-bottom:1px solid #eadcf5;align-items:center}
.trade span{display:block;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
#updated{position:absolute;z-index:5;left:23%;top:88.5%;width:74%;text-align:center;font-size:clamp(8px,1.25cqw,11px);font-weight:700;color:#4a3578;white-space:nowrap;overflow:hidden}
#error{display:none;position:fixed;z-index:20;bottom:8px;left:8px;right:8px;padding:12px;background:#fff;border:1px solid #d7a2e9;border-radius:10px;font-size:12px;line-height:1.5;overflow-wrap:anywhere;box-shadow:0 3px 14px rgba(80,30,120,.12)}
/* ===== v2: キャラ演出 & かわいさ底上げ ===== */
body{background:linear-gradient(180deg,#ffe9fb 0%,#f3e9ff 45%,#ffeef7 100%)}
#app{box-shadow:0 0 44px rgba(214,120,220,.35),0 0 0 1px rgba(255,255,255,.65)}
.bar .fill{position:relative}
.bar .fill::after{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.75) 50%,transparent 70%);background-size:250% 100%;animation:barShine 3.4s ease-in-out infinite}
@keyframes barShine{0%{background-position:120% 0}55%,100%{background-position:-120% 0}}
/* 女の子切り取りオーバーレイ（背景画像と位置合わせして重ねる） */
.chara{position:absolute;z-index:3;background-image:url("./6F57182A-FA99-4BC6-A546-EAF0793E5B02.png");background-repeat:no-repeat;pointer-events:none;will-change:transform,filter}
#charaHero{left:26.5%;top:1%;width:35%;height:16.8%;background-size:285.714% 595.238%;background-position:40.77% 1.2%;-webkit-mask-image:radial-gradient(ellipse 74% 70% at 50% 47%,#000 56%,transparent 76%);mask-image:radial-gradient(ellipse 74% 70% at 50% 47%,#000 56%,transparent 76%)}
#charaMini{left:22.6%;top:61.9%;width:9.2%;height:6.6%;background-size:1086.96% 1515.15%;background-position:24.89% 66.27%;-webkit-mask-image:radial-gradient(ellipse 70% 70% at 50% 50%,#000 62%,transparent 82%);mask-image:radial-gradient(ellipse 70% 70% at 50% 50%,#000 62%,transparent 82%)}
.chara-win #charaHero{animation:charaBounce .95s ease-in-out infinite}
.chara-win #charaMini{animation:charaBounce 1.1s ease-in-out infinite}
.chara-angry #charaHero{animation:charaShake .32s linear infinite;filter:drop-shadow(0 0 10px rgba(255,64,90,.55))}
.chara-angry #charaMini{animation:charaShake .32s linear infinite}
.chara-cry #charaHero{animation:charaSink 2.8s ease-in-out infinite;filter:saturate(.72) brightness(.985)}
.chara-cry #charaMini{animation:charaSink 2.8s ease-in-out infinite;filter:saturate(.72) brightness(.985)}
.chara-nervous #charaHero{animation:charaJitter .55s ease-in-out infinite}
.chara-nervous #charaMini{animation:charaJitter .55s ease-in-out infinite}
.chara-idle #charaHero{animation:charaFloat 3.4s ease-in-out infinite}
.chara-idle #charaMini{animation:charaFloat 3.8s ease-in-out infinite}
@keyframes charaBounce{0%,100%{transform:translateY(0)}30%{transform:translateY(-2.4%)}55%{transform:translateY(.4%)}75%{transform:translateY(-1.2%)}}
@keyframes charaShake{0%,100%{transform:translate(0,0) rotate(0deg)}20%{transform:translate(-.9%,.3%) rotate(-.7deg)}40%{transform:translate(.9%,-.2%) rotate(.7deg)}60%{transform:translate(-.7%,-.3%) rotate(-.5deg)}80%{transform:translate(.7%,.3%) rotate(.5deg)}}
@keyframes charaSink{0%,100%{transform:translateY(.4%) rotate(-.5deg)}50%{transform:translateY(2%) rotate(.5deg)}}
@keyframes charaJitter{0%,100%{transform:translate(0,0)}25%{transform:translate(.55%,-.45%)}50%{transform:translate(-.5%,.3%)}75%{transform:translate(.4%,.5%)}}
@keyframes charaFloat{0%,100%{transform:translateY(-.8%)}50%{transform:translateY(1%)}}
/* 吹き出し（焼き込み吹き出しの上に被せてセリフを表示） */
#speech{position:absolute;z-index:8;left:60.2%;top:3%;width:17.2%;height:9.2%;display:flex;align-items:center;justify-content:center;padding:1cqw 1.4cqw;background:radial-gradient(ellipse at 50% 38%,#fff 55%,#ffeef9 100%);border:2px solid #f49bd8;border-radius:50%/58%;box-shadow:0 4px 14px rgba(216,90,180,.28),inset 0 0 0 3px rgba(255,255,255,.85);animation:bubbleBob 3.4s ease-in-out infinite}
#speech::after{content:"";position:absolute;left:-4.5%;bottom:16%;width:13%;height:20%;background:#ffeef9;border-left:2px solid #f49bd8;border-bottom:2px solid #f49bd8;border-bottom-left-radius:70%;transform:rotate(24deg) skewX(-18deg)}
#speechText{font-family:"M PLUS Rounded 1c",-apple-system,"Hiragino Kaku Gothic ProN",sans-serif;font-size:clamp(8px,1.62cqw,14px);font-weight:800;line-height:1.32;color:#8a2b78;text-align:center;letter-spacing:.01em}
@keyframes bubbleBob{0%,100%{transform:translateY(0) rotate(-.6deg)}50%{transform:translateY(-2.5%) rotate(.6deg)}}
/* エフェクト（ハート/涙/汗/怒り/キラキラ） */
.fx{position:absolute;z-index:7;pointer-events:none;overflow:visible}
#fxHero{left:26.5%;top:1%;width:35%;height:16.8%}
#fxMini{left:21.4%;top:61.2%;width:11.6%;height:8%;z-index:7}
.fx i{position:absolute;display:block;opacity:0}
.fx svg{display:block;width:100%;height:100%}
.fx .heart{width:9%;aspect-ratio:1;filter:drop-shadow(0 1px 3px rgba(230,60,160,.45))}
.fx .star{width:7.5%;aspect-ratio:1;filter:drop-shadow(0 0 4px rgba(255,205,60,.8))}
.fx .tear{width:5.5%;aspect-ratio:.72;filter:drop-shadow(0 1px 2px rgba(70,130,255,.5))}
.fx .sweat{width:6%;aspect-ratio:.72;filter:drop-shadow(0 1px 2px rgba(70,140,255,.5))}
.fx .anger{width:12%;aspect-ratio:1;filter:drop-shadow(0 1px 4px rgba(255,60,80,.55))}
.fxMini .heart{width:15%}.fxMini .tear{width:10%}.fxMini .sweat{width:11%}.fxMini .anger{width:20%}.fxMini .star{width:12%}
#fxHero .h1{left:66%;top:8%}#fxHero .h2{left:16%;top:16%}#fxHero .h3{left:78%;top:36%}
#fxHero .s1{left:8%;top:34%}#fxHero .s2{left:84%;top:14%}#fxHero .s3{left:56%;top:2%}
#fxHero .t1{left:29.5%;top:52%}#fxHero .t2{left:52.5%;top:52%}
#fxHero .w1{left:61%;top:32%}
#fxHero .a1{left:71%;top:6%}
#fxMini .h1{left:74%;top:2%}#fxMini .s1{left:2%;top:10%}
#fxMini .t1{left:22%;top:46%}#fxMini .t2{left:60%;top:46%}
#fxMini .w1{left:78%;top:26%}#fxMini .a1{left:76%;top:0}
.chara-win .fx .heart{animation:heartFloat 1.7s ease-in infinite}
.chara-win .fx .h2{animation-delay:.45s}.chara-win .fx .h3{animation-delay:.9s}
.chara-win .fx .star,.chara-idle .fx .star{animation:twinkle 1.5s ease-in-out infinite}
.chara-win .fx .s2,.chara-idle .fx .s2{animation-delay:.5s}
.chara-win .fx .s3,.chara-idle .fx .s3{animation-delay:1s}
.chara-cry .fx .tear{animation:tearDrop 1.5s ease-in infinite}
.chara-cry .fx .t2{animation-delay:.7s}
.chara-nervous .fx .sweat{animation:sweatDrop 1.3s ease-in infinite}
.chara-angry .fx .anger{animation:angerPop .62s ease-in-out infinite}
@keyframes heartFloat{0%{opacity:0;transform:translateY(28%) scale(.6) rotate(-8deg)}18%{opacity:1}70%{opacity:1}100%{opacity:0;transform:translateY(-95%) scale(1.15) rotate(9deg)}}
@keyframes twinkle{0%,100%{opacity:.15;transform:scale(.55) rotate(0deg)}50%{opacity:1;transform:scale(1.1) rotate(24deg)}}
@keyframes tearDrop{0%{opacity:0;transform:translateY(-12%) scale(.7)}22%{opacity:1}78%{opacity:1}100%{opacity:0;transform:translateY(125%) scale(1)}}
@keyframes sweatDrop{0%{opacity:0;transform:translate(-18%,-14%) scale(.7) rotate(-14deg)}25%{opacity:1}80%{opacity:1}100%{opacity:0;transform:translate(38%,96%) scale(1) rotate(8deg)}}
@keyframes angerPop{0%,100%{opacity:1;transform:scale(.82) rotate(-7deg)}50%{opacity:1;transform:scale(1.18) rotate(7deg)}}
/* 常時キラキラ装飾 */
.glitter{position:absolute;z-index:6;pointer-events:none;color:#ffb52e;opacity:0;animation:twinkle 2.3s ease-in-out infinite}
.glitter svg{display:block;width:100%;height:100%}
#g1{left:20.5%;top:26.2%;width:2.6%}#g2{left:75%;top:25.6%;width:2.1%;animation-delay:.7s}
#g3{left:21.5%;top:43.4%;width:2.2%;animation-delay:1.2s}#g4{left:70%;top:56.4%;width:2.4%;animation-delay:.35s}
#g5{left:19.8%;top:77.6%;width:2.3%;animation-delay:1.6s}#g6{left:88%;top:41.8%;width:1.9%;animation-delay:.95s}
@media(max-width:380px){
#priceUsd{font-size:clamp(8px,1.7cqw,13px)}
#equityUsd{font-size:clamp(9px,1.85cqw,14px)}
#realizedUsd{font-size:clamp(9px,1.8cqw,14px)}
#reason{font-size:clamp(7px,1.25cqw,11px)}
#tradeRows{font-size:clamp(7px,1.25cqw,11px)}
#updated{font-size:clamp(7px,1.1cqw,10px)}
.fib{font-size:clamp(8px,1.5cqw,12px)}
.engine{font-size:clamp(8px,1.45cqw,12px)}
}
@media(min-width:865px){#app{margin:0 auto}}
@media(prefers-reduced-motion:reduce){.bar .fill{transition:none}.bar .fill::after{animation:none}#charaHero,#charaMini,#speech,.fx i,.glitter{animation:none!important}.fx i{opacity:0}.glitter{opacity:.5}}
</style>
</head>

<script>
"use strict";
let USDJPY=150;
const $=id=>document.getElementById(id);
let loading=false,lastData=null,lastLoadSuccess=false;
function get(o,paths,def=null){for(const p of paths){let v=o;for(const k of p.split(".")){if(v==null){v=undefined;break}v=v[k]}if(v!==undefined&&v!==null&&v!=="")return v}return def}
function n(v){if(v===null||v===undefined||v==="")return null;const x=Number(v);return Number.isFinite(x)?x:null}
function fmt(v,d=2){const x=n(v);if(x===null)return"--";return x.toLocaleString("en-US",{minimumFractionDigits:d,maximumFractionDigits:d})}
function usd(v){const x=n(v);return x===null?"--":"$"+fmt(x)}
function jpy(v){const x=n(v);return x===null?"":"約¥"+Math.round(x*USDJPY).toLocaleString("ja-JP")}
function signed(v){const x=n(v);return x===null?"--":(x>0?"+":"")+fmt(x)}
function put(id,v){const el=$(id);if(!el)return;el.textContent=(v===null||v===undefined||v==="")?"--":String(v)}
function color(id,v){const el=$(id),x=n(v);el.classList.remove("good","bad");if(x!==null)el.classList.add(x>=0?"good":"bad")}
function side(v){const s=String(v??"WAIT").toUpperCase();if(s.includes("LONG")||s==="BUY")return"LONG";if(s.includes("SHORT")||s==="SELL")return"SHORT";return"WAIT"}
function trendLabel(v){const s=String(v??"--").toUpperCase();if(s==="SIDEWAYS"||s==="SIDE")return"SIDE";if(s==="UP")return"UP";if(s==="DOWN")return"DOWN";return s||"--"}
function measureTextWidth(el){const text=el.textContent||"";if(!text)return 0;const style=getComputedStyle(el);const canvas=measureTextWidth.canvas||(measureTextWidth.canvas=document.createElement("canvas"));const ctx=canvas.getContext("2d");if(!ctx)return el.scrollWidth;ctx.font=[style.fontWeight,style.fontSize,style.fontFamily].join(" ");let width=ctx.measureText(text).width;const spacing=parseFloat(style.letterSpacing);if(Number.isFinite(spacing)&&text.length>1)width+=spacing*(text.length-1);return Math.max(width,el.scrollWidth)}
function fitText(id,minSize=8,maxSize=18){const el=$(id);if(!el)return;const parent=el.parentElement;if(!parent)return;const available=parent.clientWidth;if(available<=0)return;el.style.fontSize="";const computed=parseFloat(getComputedStyle(el).fontSize);let size=Math.min(Number.isFinite(computed)?computed:maxSize,maxSize);for(let i=0;i<40;i++){el.style.fontSize=size+"px";if(measureTextWidth(el)<=available-2)break;if(size<=minSize)break;size-=0.5}size=Math.max(minSize,size);el.style.fontSize=size+"px";el.style.maxWidth="100%"}
function fitAllText(){fitText("priceUsd",8,16);fitText("priceJpy",7,12);fitText("equityUsd",9,17);fitText("equityJpy",7,12);fitText("realizedUsd",9,17);fitText("winrateValue",9,18);fitText("pnlUsd",8,16);fitText("pnlJpy",7,12);fitText("maxddValue",9,17);fitText("signalValue",9,17);fitText("scoreValue",9,17);fitText("rsiValue",9,16);fitText("positionValue",8,15);fitText("openPnlValue",8,15);fitText("countValue",8,14);fitText("latestValue",8,14)}
function tradesOf(d){const a=get(d,["recent_trades","paper_trades","trades","closed_trades"],[]);return Array.isArray(a)?a:[]}
function pnlOf(t){return n(get(t,["net_pnl","pnl","profit","realized_pnl","realised_pnl"]))}
function closed(a){return a.filter(t=>{if(!t||typeof t!=="object")return false;return t.exit_price!=null||t.exit_time!=null||t.closed_at!=null||String(get(t,["status","state"],"")).toLowerCase().includes("closed")})}
function historyOf(d){const a=get(d,["equity_history","equity_curve","balance_history","history","snapshots"],[]);if(!Array.isArray(a))return[];return a.map(x=>{if(typeof x==="number")return x;return n(get(x,["marked_equity","equity","balance","value","account_value"]))}).filter(x=>x!==null&&x>0).slice(-500)}
function draw(values){const cv=$("equityChart"),rect=cv.getBoundingClientRect(),dpr=Math.min(window.devicePixelRatio||1,2);const w=Math.max(1,rect.width),h=Math.max(1,rect.height);cv.width=Math.round(w*dpr);cv.height=Math.round(h*dpr);const ctx=cv.getContext("2d");if(!ctx)return;ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,w,h);if(!Array.isArray(values)||values.length<2)return;let min=Math.min(...values),max=Math.max(...values);if(max-min<0.000001){min-=1;max+=1}const pad=3;const points=values.map((v,i)=>({x:pad+i/(values.length-1)*(w-pad*2),y:pad+(max-v)/(max-min)*(h-pad*2)}));ctx.beginPath();points.forEach((p,i)=>{if(i===0)ctx.moveTo(p.x,p.y);else ctx.lineTo(p.x,p.y)});ctx.lineTo(points[points.length-1].x,h);ctx.lineTo(points[0].x,h);ctx.closePath();const gradient=ctx.createLinearGradient(0,0,0,h);gradient.addColorStop(0,"rgba(239,64,177,.25)");gradient.addColorStop(1,"rgba(173,110,241,.02)");ctx.fillStyle=gradient;ctx.fill();ctx.beginPath();points.forEach((p,i)=>{if(i===0)ctx.moveTo(p.x,p.y);else ctx.lineTo(p.x,p.y)});ctx.strokeStyle="#e546b0";ctx.lineWidth=Math.max(1.5,w*.005);ctx.lineJoin="round";ctx.lineCap="round";ctx.stroke();const last=points[points.length-1];ctx.beginPath();ctx.arc(last.x,last.y,Math.max(2,w*.009),0,Math.PI*2);ctx.fillStyle="#8245db";ctx.fill()}
function fibs(d){const candidates=[get(d,["signal.fibonacci"]),get(d,["fibonacci"]),get(d,["fib"]),get(d,["indicators.fibonacci"])];let fib=null;for(const c of candidates){if(c&&typeof c==="object"){fib=c;break}}if(!fib){const price=n(get(d,["price","market.price","btc_price"]));if(price!==null){const span=price*0.03,sh=price+span,sl=price-span,r=sh-sl;return[sh,sh-r*0.236,sh-r*0.382,sh-r*0.5,sh-r*0.618,sh-r*0.786,sl]}return[null,null,null,null,null,null,null]}const levels=get(fib,["levels"],null)||fib;const hi=n(get(fib,["swing_high","high","hi"]));const lo=n(get(fib,["swing_low","low","lo"]));const pick=(obj,keys)=>{for(const k of keys){const v=n(obj&&obj[k]);if(v!==null)return v}return null};if(levels&&typeof levels==="object"&&!Array.isArray(levels)){const v236=pick(levels,["0.236","23.6","236","0.23"]);const v382=pick(levels,["0.382","38.2","382","0.38"]);const v500=pick(levels,["0.5","0.500","50","50.0","0.50"]);const v618=pick(levels,["0.618","61.8","618","0.61"]);const v786=pick(levels,["0.786","78.6","786","0.78"]);if([v236,v382,v500,v618,v786].some(v=>v!==null))return[hi,v236,v382,v500,v618,v786,lo]}if(Array.isArray(levels)){const vals=levels.map(n);if(vals.length>=7)return vals.slice(0,7)}if(hi!==null&&lo!==null&&hi>lo){const range=hi-lo;return[hi,hi-range*0.236,hi-range*0.382,hi-range*0.5,hi-range*0.618,hi-range*0.786,lo]}const price=n(get(d,["price","market.price","btc_price"]));if(price!==null){const span=price*0.03,sh=price+span,sl=price-span,r=sh-sl;return[sh,sh-r*0.236,sh-r*0.382,sh-r*0.5,sh-r*0.618,sh-r*0.786,sl]}return[null,null,null,null,null,null,null]}
function renderTrades(all){const box=$("tradeRows");box.replaceChildren();all.slice(-4).reverse().forEach(t=>{const row=document.createElement("div");row.className="trade";const p=pnlOf(t);const time=String(get(t,["exit_time","closed_at","timestamp","time","entry_time"],"--")).replace("T"," ").replace("Z","").slice(0,16);const direction=side(get(t,["side","direction","position","type"],"--"));const entry=n(get(t,["entry_price","entry","open_price","avg_entry"]));const exitp=n(get(t,["exit_price","close_price","exit","avg_exit"]));const reason=String(get(t,["reason","exit_reason","close_reason","strategy"],"--"));const entryText=entry===null?"--":Math.round(entry).toLocaleString("en-US");const exitText=exitp===null?"--":Math.round(exitp).toLocaleString("en-US");const values=[time,direction,entryText,exitText,p===null?"--":signed(p),reason];values.forEach((v,k)=>{const span=document.createElement("span");span.textContent=String(v);span.title=String(v);if(k===1){if(direction==="LONG")span.style.color="#d62b98";if(direction==="SHORT")span.style.color="#3478d8"}if(k===4&&p!==null)span.style.color=p>=0?"#d62b98":"#3478d8";row.appendChild(span)});box.appendChild(row)})}
const CHARA_LINES={
win:["やったぁ♡ 勝ったよ、ご主人さま！","すごいすごい！ この調子でいこうね♡","キラキラの勝利だね✦"],
angry:["もー！ なんで負けちゃうのっ…！","ぷんぷん！ 次は絶対に勝つんだから！","ご主人さま、次はしっかり勝とうね…！"],
cry:["うぅ…負けちゃった…","ごめんね、ご主人さま…しくしく","次は…次は頑張るから…"],
nervous:["ドキドキする…大丈夫かなぁ…","ひぅ…含み損が心配だよぉ","お、落ち着いて…見守らなきゃ…"],
idle:["ご主人さま♡ 一緒に最強の未来をつくろうね！","次の冒険を待ってるよ♪","わたしにまかせてね♡"]
};
const CHARA_CLASSES=["chara-win","chara-angry","chara-cry","chara-nervous","chara-idle"];
let charaStateNow="",charaLineIdx=0;
function charaStateOf(d,position,unrealized,closedTrades,initial){
const hasPos=(position&&typeof position==="object")||get(d,["has_position"])===true;
const streak=n(get(d,["risk.consecutive_losses","metrics.consecutive_losses"]))??0;
const last=closedTrades&&closedTrades.length?closedTrades[closedTrades.length-1]:null;
const lastPnl=last?pnlOf(last):null;
const bigLoss=-Math.max(1,(initial||100)*0.02);
if(hasPos&&unrealized>0)return"win";
if(hasPos&&unrealized<0)return"nervous";
if(streak>=3)return"angry";
if(lastPnl!==null&&lastPnl<=bigLoss)return"angry";
if(lastPnl!==null&&lastPnl>0)return"win";
if(lastPnl!==null&&lastPnl<0)return"cry";
return"idle"}
function updateChara(d,position,unrealized,closedTrades,initial){
const app=$("app");if(!app)return;
const state=charaStateOf(d,position,unrealized,closedTrades,initial);
if(state!==charaStateNow){charaStateNow=state;charaLineIdx=0}
else{charaLineIdx++}
CHARA_CLASSES.forEach(c=>app.classList.remove(c));
app.classList.add("chara-"+state);
app.dataset.chara=state;
const lines=CHARA_LINES[state];
put("speechText",lines[charaLineIdx%lines.length]);
}
function render(d){if(!d||typeof d!=="object")throw new Error("JSONデータの形式が正しくありません。");lastData=d;const fxRate=n(get(d,["usdjpy","fx_rate","usd_jpy","USDJPY"]));if(fxRate!==null&&fxRate>50&&fxRate<300)USDJPY=fxRate;const price=n(get(d,["price","market.price","btc_price"]));const equity=n(get(d,["marked_equity","equity","metrics.equity"]));const initial=n(get(d,["initial_equity","initial_bankroll"],100))??100;const all=tradesOf(d);const closedTrades=closed(all);const pnlValues=closedTrades.map(pnlOf).filter(v=>v!==null);const wins=pnlValues.filter(v=>v>0).length;let winrate=n(get(d,["metrics.win_rate","win_rate","winrate"]));if(winrate!==null&&winrate>=0&&winrate<=1)winrate*=100;if(winrate===null&&pnlValues.length>0)winrate=wins/pnlValues.length*100;const realized=n(get(d,["realized_pnl","metrics.total_net_pnl"]))??pnlValues.reduce((a,b)=>a+b,0);const position=get(d,["position","open_position","open_trade"],null);const unrealized=n(get(d,["unrealized_pnl","position.unrealized_pnl","position.unrealized_pnl_usd","open_pnl"]))??0;const dd=n(get(d,["max_drawdown_pct","risk.max_drawdown_pct","metrics.max_drawdown_pct","risk.drawdown_pct","current_drawdown_pct"]));put("priceUsd",price===null?"--":usd(price));put("priceJpy",price===null?"":jpy(price));put("equityUsd",equity===null?"--":usd(equity));put("equityJpy",equity===null?"":jpy(equity));put("realizedUsd",signed(realized));color("realizedUsd",realized);put("winrateValue",winrate===null?"--":winrate.toFixed(1)+"%");put("pnlUsd",signed(unrealized));put("pnlJpy",jpy(unrealized));color("pnlUsd",unrealized);put("maxddValue",dd===null?"--":Math.abs(dd).toFixed(2)+"%");const signal=side(get(d,["signal.direction","signal","current_signal"],"WAIT"));const score=n(get(d,["signal.score"]));const rsi=n(get(d,["signal.rsi","indicators.rsi_15m","rsi_15m"]));put("signalValue",signal);put("scoreValue",score===null?"--":score);put("rsiValue",rsi===null?"--":rsi.toFixed(1));$("signalValue").classList.remove("good","bad");if(signal==="LONG")$("signalValue").classList.add("good");if(signal==="SHORT")$("signalValue").classList.add("bad");const reasons=get(d,["signal.reasons","signal.reason"],[]);let reasonText="";if(Array.isArray(reasons))reasonText=reasons.filter(Boolean).slice(0,2).join("・");else if(typeof reasons==="string")reasonText=reasons;put("reasonValue",reasonText||"理由データなし");const fibValues=fibs(d);["fib0","fib236","fib382","fib50","fib618","fib786","fib100"].forEach((id,i)=>{const value=fibValues[i];put(id,value===null||value===undefined?"--":fmt(value,0))});let positionSide="WAIT";if(position&&typeof position==="object")positionSide=side(get(position,["side","direction","type"],"WAIT"));else if(position)positionSide=side(position);put("positionValue",positionSide==="WAIT"?"NONE":positionSide);put("openPnlValue",signed(unrealized));color("openPnlValue",unrealized);const marketStatus=String(get(d,["market_status"],"--"));put("botStatus",marketStatus==="OK"?"OK":marketStatus);put("status15m",trendLabel(get(d,["timeframes.15m.direction","signal.trend_15m"],"--")));put("status1h",trendLabel(get(d,["timeframes.1h.direction","signal.trend_1h"],"--")));put("status4h",trendLabel(get(d,["timeframes.4h.direction","signal.trend_4h"],"--")));let history=historyOf(d);if(history.length<2&&equity!==null)history=[initial,equity];draw(history);put("countValue",history.length);put("latestValue",equity===null?"--":usd(equity));const hpPercent=equity!==null&&initial>0?equity/initial*100:0;$("hpFill").style.width=Math.max(0,Math.min(100,hpPercent))+"%";const totalWins=n(get(d,["metrics.wins","rpg.total_wins","total_wins"]))??wins;$("xpFill").style.width=(((totalWins%10+10)%10)*10)+"%";renderTrades(all);const generated=get(d,["generated_at","updated_at","timestamp"]);let timestampText="更新時刻不明";if(generated){const date=new Date(generated);if(!Number.isNaN(date.getTime()))timestampText="更新: "+date.toLocaleString("ja-JP",{month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit"})}put("updated",timestampText+" ｜ PAPER ONLY ｜ 60秒ごとに更新");updateChara(d,position,unrealized,closedTrades,initial);requestAnimationFrame(()=>{fitAllText()})}
async function fetchJson(path){const response=await fetch(path+"?t="+Date.now(),{cache:"no-store"});if(!response.ok)throw new Error(path+" HTTP "+response.status);return await response.json()}
async function load(){if(loading)return;loading=true;const errorBox=$("error");const paths=["./data.json","./docs/data.json","./state.json","./docs/state.json"];const failures=[];try{for(const path of paths){try{const data=await fetchJson(path);if(!data||typeof data!=="object"){failures.push(path+": JSON形式が不正");continue}const price=n(get(data,["price","market.price","btc_price"]));const equity=n(get(data,["marked_equity","equity","metrics.equity"]));if(price===null&&equity===null){failures.push(path+": 価格・資産データが見つからない");continue}render(data);lastLoadSuccess=true;errorBox.style.display="none";return}catch(e){failures.push(path+": "+String(e.message||e))}}errorBox.style.display="block";errorBox.textContent="データを読み込めません。GitHub Pagesの公開先と、docs/data.json の存在を確認してください。";if(!lastLoadSuccess)put("updated","データ待機中 ｜ GitHub Actionsの実行結果を確認してください");console.warn("BTC冒険記 データ読み込みエラー:",failures)}finally{loading=false}}
load();
setInterval(()=>{load()},60000);
window.addEventListener("resize",()=>{if(lastData){requestAnimationFrame(()=>{draw(historyOf(lastData));fitAllText()})}});
document.addEventListener("visibilitychange",()=>{if(!document.hidden)load()});
