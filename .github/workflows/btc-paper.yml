
name: BTC Paper Engine

on:
  workflow_dispatch:

  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

concurrency:
  group: btc-paper-engine
  cancel-in-progress: false

jobs:
  paper-trading:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run BTC paper engine
        run: python bot.py

      - name: Commit paper state and dashboard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json docs/data.json
          git diff --cached --quiet || git commit -m "Update BTC paper results"
          git push
